[package]
name = "gglib-app"
version.workspace = true
description = "Tauri GUI for GGLib - GGUF Model Manager"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-autostart.workspace = true
serde.workspace = true
serde_json.workspace = true
gglib-build-info.workspace = true
gglib-core.workspace = true
gglib-runtime = { workspace = true, features = ["cli"] }
gglib-tauri.workspace = true
gglib-axum.workspace = true
gglib-app-services.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# Note: axum and tower-http are used via gglib-axum re-exports, no direct dependency needed
dotenvy.workspace = true
tracing.workspace = true
open.workspace = true

# Only the tray panel's layer-shell placement needs these, and only on Linux.
# `libgtk-layer-shell` itself is loaded at runtime rather than linked, so it is
# not required to build or to launch — see `tray::layer_shell`.
[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
ksni.workspace = true
libloading.workspace = true

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused = true)]`, and `macros` for the
# attribute itself. The watcher's timing rules — a wake arrives, or the poll
# interval elapses — are only testable against a clock the test controls; the
# alternative is a suite that sleeps two seconds per assertion.
tokio = { workspace = true, features = ["macros", "test-util"] }

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
default = []

# This crate had no `[lints]` section at all, so it inherited nothing and
# enforced nothing. `gglib-app` is a single binary target with no lib and no
# workspace consumer, which makes every `pub` in it reachable by nobody — the
# state this PR just cleared. Denying the lint keeps it cleared.
[lints.rustdoc]
# Mirrors `[workspace.lints.rustdoc]`, which this crate cannot inherit while it
# declares its own lint keys. Read the rationale there before changing this.
private_intra_doc_links = "allow"

[lints.rust]
unreachable_pub = "deny"
