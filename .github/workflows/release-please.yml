# Keeps a branch's standing release pull request,
# "chore(<branch>): release X.Y.Z-rc.N", up to date with the branch: main's,
# which carries the next minor's candidates, and each maintenance line's,
# release/X.Y.x, which carries that version's patches (CONTRIBUTING,
# "Maintenance lines"). release-please reads the commit types since the last
# release and works out the next candidate (release-please-config.json says
# how, read from the branch), then writes it into Cargo.toml, package.json
# and the manifest, and adds its changes to CHANGELOG.md. Merging the pull
# request changes the branch's version, and CI's release job
# (release-tag.yml) tags and releases that version as a prerelease.
# Promotion to a stable version is promote.yml's job, made from the
# candidate's tag, not this one's.
#
# release-please's own choice of version is checked before it touches the pull
# request. A dry run says what it would propose, and scripts/release_lines.py
# keeps that unless the release lines refuse it. Three proposals are refused
# with one right answer each, which the real run is then made to propose:
# after a promotion, the shipped version's rc.N+1 (Promote tags the stable
# version from the candidate's commit, so release-please still counts the
# candidate as the last release); and the stable X.Y.0 that a feat over a
# patch candidate makes it propose. So the release PR never waits on a
# `Release-As:` line, and one written on purpose still decides the version.
#
# release-please knows nothing of Cargo.lock or package-lock.json, and CI
# builds with --locked, so after every update this workflow adds a commit that
# moves the workspace's own versions in both lockfiles.
#
# Everything that writes uses the GitHub App token, as update-deps.yml does: a
# pull request opened or pushed with GITHUB_TOKEN starts no workflows, so CI
# would never run on the release PR.

name: Release PR

# After CI on the branch, not on the push: CI's release job tags a changed
# version, and release-please must see that tag before it reads the branch.
# The builds run in release.yml afterwards; release-please does not wait for
# them. Running once per green CI run also means a burst of merges rebuilds
# the pull request once, not once per merge.
#
# A workflow_run workflow runs as main holds it, whatever branch the CI run
# was on, so a line needs nothing of this file. By hand, `branch` names the
# branch whose pull request to bring up to date.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch whose release PR to update: main, or a line release/X.Y.x"
        required: false
        default: main
        type: string

# GITHUB_TOKEN only reads: the branch's version and its tag, and the pull
# requests the gate asks about.
permissions:
  contents: read
  pull-requests: read

# One group per branch: a newer CI run's trigger cancels a run still updating
# that branch's pull request, since the newer run reads a later branch and
# rewrites the same pull request from it. main's run and a line's never
# touch each other's.
concurrency:
  group: release-pr-${{ github.event.workflow_run.head_branch || inputs.branch }}
  cancel-in-progress: true

defaults:
  run:
    # GitHub's default is `bash -e`; this adds pipefail.
    shell: bash

jobs:
  release-pr:
    name: Open or update the release PR
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The branch whose pull request this run keeps: the one CI ran on, or
    # the one named by hand.
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
    outputs:
      # The open release PR of the branch, after the update: its number, its
      # head branch and its base. Empty when there is none.
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      # The commit CI tested, whose version that run's release job tagged.
      # The branch can be ahead by then, at a version whose own CI run has
      # not yet reached its release job. By hand, the branch's tip.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.branch }}

      # Only main and the lines release. Nothing else reaches here from CI,
      # whose trigger above names them, so this is for a hand run.
      - name: Require a branch that releases
        run: scripts/release_lines.py line --branch "$BRANCH"

      # Two things must be true before release-please runs, and after a green
      # CI run on the branch they are, so this checks once and fails if not.
      # It opens nothing while a merged release PR of this branch still
      # carries `autorelease: pending`: it stops with "untagged, merged
      # release PRs outstanding". It never tags (only its `release-pr`
      # command runs here), so release-tag.yml, inside the CI run this
      # follows, swaps that label for `autorelease: tagged` once it has
      # tagged the version. And it
      # reads the last release from the tag `v<version>`: with no tag, it
      # reads the branch's whole history as unreleased. A failure here means
      # the release job of that CI run did not tag: re-run it, then run this
      # workflow by hand. The label check reads this branch's merged pull
      # requests alone, as release-please does: another branch's pending
      # label is that branch's to clear.
      - name: Require the branch's version to be tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::error::v$VERSION is not tagged. Re-run the Release job of CI on $BRANCH, then run this workflow by hand for $BRANCH."
            exit 1
          fi
          pending=$(gh pr list -R "$GITHUB_REPOSITORY" --base "$BRANCH" --state merged --label 'autorelease: pending' --json number --jq 'length')
          if [ "$pending" != 0 ]; then
            echo "::error::a merged release PR of $BRANCH is still labelled 'autorelease: pending'; CI's release job relabels it when it tags, and goes on if the relabel fails. Swap the label for 'autorelease: tagged' by hand, then run this workflow by hand for $BRANCH."
            exit 1
          fi
          echo "✓ v$VERSION is tagged, and no merged release PR of $BRANCH is waiting for its tag"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The tools the steps below run, from the commit this workflow file
      # came from: main's after CI, the dispatched branch's by hand. The
      # checkout above is the branch being released, and a line cut before
      # a tool existed would not have it; a hand run from a branch tries that
      # branch's tools against the branch it names.
      - name: Checkout this workflow's tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: tools
          sparse-checkout: |
            scripts/release_lines.py
            .github/release-please
            .nvmrc
          sparse-checkout-cone-mode: false

      # The release-please CLI, pinned in .github/release-please with a
      # lockfile that Dependabot keeps current. The action is not used: it
      # ignores its `release-as` input once the config comes from a manifest
      # file, and the step after next needs that input.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: tools/.nvmrc

      - name: Install release-please
        run: npm ci --prefix tools/.github/release-please --no-audit --no-fund

      # What release-please would propose, and whether the release lines take
      # it: scripts/release_lines.py `choose` prints `release_as`, empty when
      # the proposal stands and the version to force when it does not. A
      # proposal it cannot put right stops the run here, before the pull
      # request is touched, with the same words the lock job's guard uses.
      # The dry run reads the branch's tip, as the real run does.
      - name: Choose the release PR's version
        id: choose
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          tools/.github/release-please/node_modules/.bin/release-please release-pr --dry-run \
            --token "$TOKEN" --repo-url "$GITHUB_REPOSITORY" --target-branch "$BRANCH" \
            --config-file release-please-config.json --manifest-file .release-please-manifest.json \
            > "$RUNNER_TEMP/dry-run.txt"
          echo "::group::release-please's dry run"
          cat "$RUNNER_TEMP/dry-run.txt"
          echo "::endgroup::"
          git ls-remote --tags origin > "$RUNNER_TEMP/tags.txt"
          git ls-remote --heads origin 'refs/heads/release/*' > "$RUNNER_TEMP/release-branches.txt"
          tools/scripts/release_lines.py choose --branch "$BRANCH" --dry-run "$RUNNER_TEMP/dry-run.txt" \
            --config release-please-config.json --tags "$RUNNER_TEMP/tags.txt" \
            --branches "$RUNNER_TEMP/release-branches.txt" | tee -a "$GITHUB_OUTPUT"

      # `release-pr` only keeps the pull request; it never tags or makes a
      # release. release-tag.yml tags a candidate and promote.yml a stable
      # version, and each makes the GitHub release itself, with generated
      # notes. With `always-update` in the config it rewrites the pull request
      # on every run, so the pull request is never behind its branch, which
      # the ruleset requires before a merge.
      #
      # --target-branch is the branch it reads and opens against: the config,
      # the manifest, the commits since the last release and the pull
      # request's base are all that branch's. A line cut from vX.Y.0 has a
      # manifest reading X.Y.0 and that tag on its first commit, so
      # release-please counts the cherry-picks since it and proposes
      # X.Y.1-rc.1 on its own.
      #
      # --release-as, when the step above chose one, beats both release-please's
      # own reckoning and any `Release-As:` line in the commits. It is chosen
      # only when the proposal is refused, which a `Release-As:` line naming a
      # version the lines accept never is.
      - name: Open or update the release PR
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          PROPOSED: ${{ steps.choose.outputs.proposed }}
          RELEASE_AS: ${{ steps.choose.outputs.release_as }}
        run: |
          force=()
          if [ -n "$RELEASE_AS" ]; then
            force=(--release-as "$RELEASE_AS")
            echo "::notice::release-please would propose $PROPOSED, which the release lines refuse; the release PR proposes $RELEASE_AS"
          fi
          tools/.github/release-please/node_modules/.bin/release-please release-pr \
            --token "$TOKEN" --repo-url "$GITHUB_REPOSITORY" --target-branch "$BRANCH" \
            --config-file release-please-config.json --manifest-file .release-please-manifest.json \
            "${force[@]}"

      # The pull request release-please keeps carries `autorelease: pending`
      # while it is open; a merged one waiting for its tag was ruled out
      # above. None open means nothing on the branch adds to the changelog.
      - name: Find the release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list -R "$GITHUB_REPOSITORY" --base "$BRANCH" --state open --label 'autorelease: pending' \
            --json number,headRefName > "$RUNNER_TEMP/prs.json"
          count=$(jq length "$RUNNER_TEMP/prs.json")
          if [ "$count" = 0 ]; then
            echo "✓ no release PR is open on $BRANCH"
            exit 0
          fi
          if [ "$count" != 1 ]; then
            echo "::error::$count open pull requests into $BRANCH carry 'autorelease: pending'; release-please keeps one. Close the ones it did not open, then run this workflow by hand for $BRANCH."
            exit 1
          fi
          {
            echo "number=$(jq -r '.[0].number' "$RUNNER_TEMP/prs.json")"
            echo "head=$(jq -r '.[0].headRefName' "$RUNNER_TEMP/prs.json")"
            echo "base=$BRANCH"
          } >> "$GITHUB_OUTPUT"

  lock:
    name: Lock the release's version
    needs: release-pr
    if: needs.release-pr.outputs.number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout the release PR
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-pr.outputs.head }}
          token: ${{ steps.app-token.outputs.token }}

      # The backstop. The version was chosen above to pass these same rules
      # (scripts/release_lines.py `guard-pr`, with fixtures): a candidate, of
      # a version that has not shipped, and of its own branch's line, main
      # the next minor or a patch no line has taken, a line release/X.Y.x its
      # next patch. So this refuses only what `choose` let through by a bug,
      # or a branch or a tag that moved between the two runs. Each refusal
      # names the `Release-As: X.Y.Z-rc.1` line that puts it right, at the end
      # of the message of a commit that merges next.
      - name: Require a release candidate of an unshipped version of this line
        id: guard
        env:
          BASE: ${{ needs.release-pr.outputs.base }}
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          git ls-remote --tags origin > "$RUNNER_TEMP/tags.txt"
          git ls-remote --heads origin 'refs/heads/release/*' > "$RUNNER_TEMP/release-branches.txt"
          scripts/release_lines.py guard-pr --branch "$BASE" --version "$VERSION" \
            --tags "$RUNNER_TEMP/tags.txt" --branches "$RUNNER_TEMP/release-branches.txt" >> "$GITHUB_OUTPUT"
          echo "✓ The release PR on $BASE proposes the release candidate $VERSION"

      # The workspace's own versions in both lockfiles, moved to the
      # candidate and checked; scripts/check_workflow_yaml.sh holds the
      # action to `cargo update --workspace`.
      - name: Lock the release's version
        uses: ./.github/actions/lock-the-version
        with:
          version: ${{ steps.guard.outputs.version }}

      # The action's release-please writes `, closes [#N]` after each fix in
      # the PR body, which GitHub reads as a closing keyword: merging the
      # release PR would close those issues a second time. Newer releases of
      # release-please write `refs`; this does the same until the action
      # catches up.
      #
      # It also links every number as /issues/N, a pull request's too. The
      # server forwards that to /pull/N, but a click inside GitHub opens it
      # without asking the server and shows "Unable to load page". A bare #N
      # is linked by GitHub itself, to the pull request or the issue it is.
      - name: Tidy the release PR's links
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ needs.release-pr.outputs.number }}
        run: |
          gh pr view "$NUMBER" --json body --jq .body > "$RUNNER_TEMP/body.md"
          cp "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/body-before.md"
          sed -i 's/, closes \[#/, refs [#/g' "$RUNNER_TEMP/body.md"
          sed -i -E 's#\[\#([0-9]+)\]\(https://github\.com/[^/]+/[^/]+/issues/[0-9]+\)#\#\1#g' "$RUNNER_TEMP/body.md"
          if cmp -s "$RUNNER_TEMP/body-before.md" "$RUNNER_TEMP/body.md"; then
            echo "✓ The release PR's body already refers to its issues by bare #N, without closing them"
          else
            gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/body.md"
            echo "✓ The release PR's body refers to its issues by bare #N, without closing them"
          fi

      # release-please rewrites the branch from its base on every update,
      # which drops this commit, and with `always-update` it updates on every
      # green CI run on the base; this job runs after each of those updates
      # and adds the commit back. CI's concurrency cancels the run on
      # release-please's own commit, which this one follows within minutes.
      - name: Commit the lockfiles
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ needs.release-pr.outputs.head }}
        run: |
          git add Cargo.lock package-lock.json
          if git diff --cached --quiet; then
            echo "✓ The lockfiles already carry the release's version"
            exit 0
          fi
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          git -c user.name="${SLUG}[bot]" -c user.email="${id}+${SLUG}[bot]@users.noreply.github.com" \
            commit -m "chore: lock the release's version"
          git push origin "HEAD:refs/heads/${BRANCH}"
