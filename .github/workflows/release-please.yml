# Keeps the standing release pull request, "chore(main): release X.Y.Z-rc.N",
# up to date with main. release-please reads the commit types since the last
# release and works out the next candidate (release-please-config.json says
# how), then writes it into Cargo.toml, package.json and the manifest, and adds
# its changes to CHANGELOG.md. Merging the pull request changes main's version,
# and CI's release job (release-tag.yml) tags and releases that version as a
# prerelease. Promotion to a stable version is promote.yml's job, made from
# the candidate's tag, not this one's.
#
# release-please knows nothing of Cargo.lock or package-lock.json, and CI
# builds with --locked, so after every update this workflow adds a commit that
# moves the workspace's own versions in both lockfiles.
#
# Everything that writes uses the GitHub App token, as update-deps.yml does: a
# pull request opened or pushed with GITHUB_TOKEN starts no workflows, so CI
# would never run on the release PR.

name: Release PR

# After CI on main, not on the push: CI's release job tags a changed version,
# and release-please must see that tag before it reads main. The builds run
# in release.yml afterwards; release-please does not wait for them.
# Running once per green CI run also means a burst of merges rebuilds the
# pull request once, not once per merge.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN only reads: main's version and its tag, and the pull
# requests the gate asks about.
permissions:
  contents: read
  pull-requests: read

# A newer CI run's trigger cancels a run still updating the pull request: the
# newer run reads a later main and rewrites the same pull request from it.
concurrency:
  group: release-pr
  cancel-in-progress: true

defaults:
  run:
    # GitHub's default is `bash -e`; this adds pipefail.
    shell: bash

jobs:
  release-pr:
    name: Open or update the release PR
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      updated: ${{ steps.release.outputs.prs_created }}
      # The pull request the action opened or updated, as JSON.
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # The commit CI tested, whose version that run's release job tagged.
      # main can be ahead by then, at a version whose own CI run has not yet
      # reached its release job.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Two things must be true before release-please runs, and after a green
      # CI run on main they are, so this checks once and fails if not. It
      # opens nothing while a merged release PR still carries
      # `autorelease: pending`: it stops with "untagged, merged release PRs
      # outstanding". It never tags (skip-github-release below), so
      # release-tag.yml, inside the CI run this follows, swaps that label for
      # `autorelease: tagged` once it has tagged the version. And it reads the
      # last release from the tag `v<version>`: with no tag, it reads main's
      # whole history as unreleased. A failure here means the release job of
      # that CI run did not tag: re-run it, then run this workflow by hand.
      - name: Require main's version to be tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::error::v$VERSION is not tagged. Re-run the Release job of CI on main, then run this workflow by hand."
            exit 1
          fi
          pending=$(gh pr list -R "$GITHUB_REPOSITORY" --state merged --label 'autorelease: pending' --json number --jq 'length')
          if [ "$pending" != 0 ]; then
            echo "::error::a merged release PR is still labelled 'autorelease: pending'; CI's release job relabels it when it tags, and goes on if the relabel fails. Swap the label for 'autorelease: tagged' by hand, then run this workflow by hand."
            exit 1
          fi
          echo "✓ v$VERSION is tagged, and no merged release PR is waiting for its tag"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # skip-github-release because release-please never tags here:
      # release-tag.yml tags a candidate and promote.yml a stable version, and
      # each makes the GitHub release itself, with generated notes. release-please
      # only keeps the pull request. With `always-update` in the config it
      # rewrites the pull request on every run, so the pull request is never
      # behind main, which the ruleset requires before a merge.
      - name: Open or update the release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  lock:
    name: Lock the release's version
    needs: release-pr
    if: needs.release-pr.outputs.updated == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout the release PR
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-pr.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      # A stable version comes only from promote.yml, never from this pull
      # request, and the pull request must propose a candidate of a version
      # that has not shipped. release-please gets this wrong in two cases, and
      # a `Release-As: X.Y.Z-rc.1` line at the end of the message of a commit
      # that merges next puts it right. A feat merged while main is a patch
      # candidate such as 0.29.1-rc.1 makes it propose 0.30.0 rather than
      # 0.30.0-rc.1. And after a promotion it proposes the shipped version's
      # rc.N+1: promote.yml tags the stable version from the candidate's
      # commit, not from main, so the candidate is still the last release it
      # can see from main.
      - name: Require a release candidate of an unshipped version
        id: guard
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::The release PR proposes $VERSION, which is not a release candidate; a stable version comes only from Promote. Merge a commit whose message ends with a 'Release-As: X.Y.Z-rc.1' line naming the candidate meant, and the release PR is rewritten to it."
            exit 1
          fi
          STABLE=${VERSION%-rc.*}
          if git ls-remote --exit-code --tags origin "refs/tags/v${STABLE}" > /dev/null 2>&1; then
            IFS=. read -r major minor patch <<< "$STABLE"
            echo "::error::The release PR proposes $VERSION, but $STABLE has shipped: Promote tagged v$STABLE from its candidate, so from main the candidate still looks like the last release. Merge a commit whose message ends with 'Release-As: $major.$((minor + 1)).0-rc.1' (a feat or a breaking change since $STABLE) or 'Release-As: $major.$minor.$((patch + 1))-rc.1' (fixes only), and the release PR is rewritten to it."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✓ The release PR proposes the release candidate $VERSION"

      # The workspace's own versions in both lockfiles, moved to the
      # candidate and checked; scripts/check_workflow_yaml.sh holds the
      # action to `cargo update --workspace`.
      - name: Lock the release's version
        uses: ./.github/actions/lock-the-version
        with:
          version: ${{ steps.guard.outputs.version }}

      # The action's release-please writes `, closes [#N]` after each fix in
      # the PR body, which GitHub reads as a closing keyword: merging the
      # release PR would close those issues a second time. Newer releases of
      # release-please write `refs`; this does the same until the action
      # catches up.
      - name: Keep the release PR from closing issues
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ fromJSON(needs.release-pr.outputs.pr).number }}
        run: |
          gh pr view "$NUMBER" --json body --jq .body > "$RUNNER_TEMP/body.md"
          if grep -q ', closes \[#' "$RUNNER_TEMP/body.md"; then
            sed -i 's/, closes \[#/, refs [#/g' "$RUNNER_TEMP/body.md"
            gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/body.md"
            echo "✓ The release PR's body refers to its issues without closing them"
          fi

      # release-please rewrites the branch from main on every update, which
      # drops this commit, and with `always-update` it updates on every green
      # CI run on main; this job runs after each of those updates and adds the
      # commit back. CI's concurrency cancels the run on release-please's own commit,
      # which this one follows within minutes.
      - name: Commit the lockfiles
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ fromJSON(needs.release-pr.outputs.pr).headBranchName }}
        run: |
          git add Cargo.lock package-lock.json
          if git diff --cached --quiet; then
            echo "✓ The lockfiles already carry the release's version"
            exit 0
          fi
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          git -c user.name="${SLUG}[bot]" -c user.email="${id}+${SLUG}[bot]@users.noreply.github.com" \
            commit -m "chore: lock the release's version"
          git push origin "HEAD:refs/heads/${BRANCH}"
