# Labels an issue, and holds every issue to at least one label in each of
# component:, priority:, size: and type:.
#
# Four jobs:
#   parse (`opened` only) reads the form's answers out of the issue body. The
#     body is the form's own output at that moment and at no other: a later
#     edit can mangle a heading, so it is not parsed on `edited`.
#   apply (`opened` only) applies the form's answers, then what the issue's own
#     words say to any category still empty: type: and component: from a
#     title such as `fix(cli): …`, component: from the repository paths the
#     description names, platform: from Windows or macOS in the title. The
#     rules are .github/scripts/issue-words.cjs's. A label is applied only
#     when the words point at exactly one; candidates go in the comment. A
#     category that has a label is left alone, and nothing is ever removed, so
#     the form's answer and a person's label both win. priority: and size:
#     are never read from words: each is an estimate made after reading the
#     code.
#   command (a new comment on an issue) adds the labels a reply asks for: a
#     comment with a line that is `/label <label name>`. Without write access
#     a reply gives the issue its first component:, type: or platform: label:
#     one for each of those categories that has none, and nothing for a
#     category that has a label, as `apply` leaves such a category alone.
#     With write access a reply adds any label of those three and of
#     priority: and size:, beside what is there. Write access is the event's
#     own word on the comment's author: OWNER, MEMBER or COLLABORATOR. The
#     rules are .github/scripts/label-command.cjs's. It puts a thumbs-up on a
#     comment it acted on, and ignores every other comment without a word.
#   verify (every `issues` trigger, and after a reply that was acted on)
#     re-reads the labels from the API, sets or clears status: needs-triage,
#     and keeps one comment while a category is missing: what was set and from
#     what, what is missing, the candidates the words give, and the reply that
#     adds a label. Each run rewrites it to what is missing now, and removes
#     it when nothing is. It is the fail-safe for the other three: if one
#     breaks, the issue arrives unlabelled and is flagged for a person, never
#     silently mislabelled. The words are read again here to word the
#     comment, and applied only in `apply`, so a label a person removes stays
#     removed.
#
# The form (.github/ISSUE_TEMPLATE/issue.yml) only validates in the web UI and `gh issue
# create`'s interactive prompts — a scripted `gh issue create --title X --body Y` bypasses
# it entirely, and GitHub has no issue-side equivalent of a required status check. `verify`
# is the actual guarantee, not the form.
#
# Concurrency is per job, not per workflow. An issue created with labels sends
# `opened` and one `labeled` for each label at once, and a group over the whole
# workflow lets those runs cancel the one that parses and applies, and would
# let any comment cancel them too. `parse` and `apply` are in no group: an issue
# is opened once. Nor is `command`: each reply adds its own labels, and adding
# is all it does. `verify` runs one at a time for an issue, and a run that
# waits gives way to a newer one, so the last to run reads the labels `apply`
# or `command` set.
#
# A comment is public input. Its text reaches label-command.cjs in the event's
# payload and is only compared with the names of the repository's labels: it is
# never part of a script's text or of a shell command, and what is added is the
# repository's own name for a label. `command`'s `if:` reads the text inside an
# expression, which GitHub evaluates and does not run. What a stranger can do
# to an issue with a reply is one label in each of three categories, and only
# where the category was empty.
#
# Loop safety rests on the default GITHUB_TOKEN. Nothing done with that token
# starts a workflow run, so a label this workflow adds does not come back as
# `labeled`, and the triage comment it writes does not come back as
# `issue_comment`. With a PAT or a GitHub App token each of them would start a
# run of this workflow. One smaller guard stands behind it for the comment:
# its text holds `/label` only inside a sentence, never as a line, so `command`
# would find no command in it, and issue-triage.test.cjs holds it to that.
# Rewriting the comment is an `edited` comment, which is not subscribed to.

name: Issue Labels

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  # Every new comment on every issue and pull request starts a run. `command`'s
  # `if:` skips all but a comment on an issue that holds the word, and with it
  # skipped `verify` is too.
  issue_comment:
    types: [created]

# Default to nothing; each job opts in to the minimum it needs.
permissions: {}

jobs:
  parse:
    name: Parse form (opened only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'issues' && github.event.action == 'opened'
    # The checkout, for the form the parser reads.
    permissions:
      contents: read
    outputs:
      json: ${{ steps.parse.outputs.jsonString }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse issue form
        id: parse
        # Pinned to a commit SHA, not a tag: this is a third-party action, unlike the
        # actions/* ones elsewhere in this repo which are GitHub-maintained. Keys its
        # output by the form's `id:` fields via template-path, not by scraping rendered
        # markdown headings ourselves — anchors on identifiers we control.
        uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3.2.5
        with:
          template-path: .github/ISSUE_TEMPLATE/issue.yml

  apply:
    name: Apply labels (opened only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: parse
    # Also when the parser failed: the words are read without it.
    if: ${{ !cancelled() && github.event_name == 'issues' && github.event.action == 'opened' }}
    # The checkout of .github/scripts, and the issue's labels.
    permissions:
      contents: read
      issues: write
    outputs:
      applied: ${{ steps.words.outputs.applied }}
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Apply the form's answers
        uses: actions/github-script@v9
        # PARSED_JSON is issue-body-derived (user-controlled) content. It MUST be passed
        # via env, not interpolated straight into `script:` as `${{ needs.parse.outputs.json }}`
        # — that form does raw textual substitution before the script is parsed, and
        # JSON.stringify does not escape single quotes. An issue description containing an
        # apostrophe ("don't", "it's" — routine, not contrived) would break out of a
        # single-quoted string literal and execute as JS with issues: write permission.
        # Reading process.env.PARSED_JSON is immune to this: env values are never
        # substituted into script source text.
        env:
          PARSED_JSON: ${{ needs.parse.outputs.json }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            // These must match .github/ISSUE_TEMPLATE/issue.yml's field `id:`s exactly.
            // scripts/check_issue_form_mapping.mjs fails CI if they ever drift apart.
            const PREFIX_FIELDS = {
              component: 'component: ',
              priority: 'priority: ',
              size: 'size: ',
              type: 'type: ',
            };

            // --- Apply whatever the form parser found ---------------------------
            const rawJson = process.env.PARSED_JSON || '';
            if (rawJson) {
              let parsed = null;
              try { parsed = JSON.parse(rawJson); }
              catch (e) { core.warning(`Could not parse form JSON, skipping apply: ${e}`); }

              if (parsed) {
                // Defensive: the parser may represent a multi-select as an array or as a
                // comma-separated string depending on field type. Normalize either way.
                const toTokens = (v) => {
                  if (v == null) return [];
                  if (Array.isArray(v)) return v.map(String);
                  const s = String(v).trim();
                  if (!s || s === '_No response_') return [];
                  return s.split(',').map(t => t.trim()).filter(Boolean);
                };

                const toApply = new Set();
                for (const [field, prefix] of Object.entries(PREFIX_FIELDS)) {
                  for (const token of toTokens(parsed[field])) {
                    toApply.add(prefix + token);
                  }
                }
                // epic is a single optional checkbox, not a prefixed field — a non-empty
                // selection means the box was ticked.
                if (toTokens(parsed.epic).length > 0) {
                  toApply.add('type: epic');
                }

                // Never let a form-option typo invent a label. The labels API CREATES a
                // label that doesn't exist rather than erroring — verified directly:
                // POSTing a nonexistent name returns 200 and yields a new label with
                // default grey (#ededed) and no description. So a stray dropdown option
                // (say `- clii`) would silently produce a junk `component: clii` label
                // that then satisfies the gate and pollutes the taxonomy.
                //
                // Filter to labels that already exist and warn loudly about the rest.
                // The issue then falls through to needs-triage in `verify` — flagged
                // for a human, which is the correct failure direction.
                if (toApply.size) {
                  const repoLabels = new Set((await github.paginate(
                    github.rest.issues.listLabelsForRepo, { owner, repo, per_page: 100 },
                  )).map(l => l.name));

                  const unknown = [...toApply].filter(l => !repoLabels.has(l));
                  const known = [...toApply].filter(l => repoLabels.has(l));

                  if (unknown.length) {
                    core.warning(
                      `Refusing to create nonexistent label(s): ${unknown.join(', ')}. `
                      + `Check .github/ISSUE_TEMPLATE/issue.yml's dropdown options against `
                      + `the repo's actual labels — an option with no matching label would `
                      + `otherwise be auto-created as an untitled grey label.`);
                  }
                  if (known.length) {
                    await github.rest.issues.addLabels({
                      owner, repo, issue_number, labels: known,
                    });
                    core.info(`Applied from form: ${known.join(', ')}`);
                  }
                }
              }
            }

      # After the form's answers, so a category the form filled is not read
      # from the words; and when that step failed, since the words need
      # nothing from it. The title and description never reach this script's
      # text: issue-triage.cjs reads them from the API.
      - name: Apply what the issue's words say
        id: words
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          script: |
            const { applyFromWords } = require('./.github/scripts/issue-triage.cjs');
            const { owner, repo } = context.repo;
            const applied = await applyFromWords({
              github, core, owner, repo, issue_number: context.payload.issue.number,
            });
            core.setOutput('applied', JSON.stringify(applied));

  command:
    name: Add the labels a reply asks for
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A comment on an issue, not on a pull request, that holds the word
    # anywhere, in any letter case. label-command.cjs then reads it line by
    # line, and checks again that the issue is not a pull request.
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '/label')
    # The checkout of .github/scripts; the issue's labels and the reaction.
    permissions:
      contents: read
      issues: write
    outputs:
      acted: ${{ steps.reply.outputs.acted }}
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # The comment reaches the module as `context.payload.comment`, never as
      # text in this script.
      - name: Add the labels the comment asks for
        id: reply
        uses: actions/github-script@v9
        with:
          script: |
            const { runLabelCommands } = require('./.github/scripts/label-command.cjs');
            core.setOutput('acted', await runLabelCommands({ github, core, context }));

  verify:
    name: Verify the required labels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [apply, command]
    # On `issues`, whatever became of `apply`: it is skipped on every trigger
    # but `opened`, and an issue it failed on is still flagged. On a comment,
    # only after a reply `command` acted on: a label added with the default
    # token sends no `labeled`, so this is the run that sees it.
    if: ${{ always() && (github.event_name == 'issues' || needs.command.outputs.acted == 'true') }}
    concurrency:
      group: issue-labels-${{ github.event.issue.number }}
      cancel-in-progress: false
    # The checkout of .github/scripts; the issue's labels and the comment.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check the required categories
        uses: actions/github-script@v9
        # The names of the labels `apply` set, through the environment as
        # PARSED_JSON is. `verify` says a label was set only while the issue
        # carries it.
        env:
          APPLIED_JSON: ${{ needs.apply.outputs.applied }}
        with:
          script: |
            const { verify } = require('./.github/scripts/issue-triage.cjs');
            const { owner, repo } = context.repo;
            await verify({
              github, core, owner, repo, issue_number: context.payload.issue.number,
              applied: JSON.parse(process.env.APPLIED_JSON || '[]'),
            });
