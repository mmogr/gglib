# Applies component:/priority:/size:/type: labels from the issue.yml form, and backstops
# the cases where the form gets bypassed.
#
# Two-step split, deliberately:
#   Step A (parse, `opened` only) — the issue body is machine-generated by the form at
#     that exact moment, so this is the one point where parsing it is safe. Any later
#     edit to the description could accidentally mangle a heading, so parsing does NOT
#     run on `edited` — only verification does.
#   Step B (verify, every trigger) — re-reads labels via the API and applies/removes
#     status: needs-triage. This is Step A's fail-safe: if parsing ever breaks for any
#     reason, the issue simply arrives unlabelled and gets flagged for a human. It never
#     gets silently mislabelled.
#
# The form (.github/ISSUE_TEMPLATE/issue.yml) only validates in the web UI and `gh issue
# create`'s interactive prompts — a scripted `gh issue create --title X --body Y` bypasses
# it entirely, and GitHub has no issue-side equivalent of a required status check. Step B
# is the actual guarantee, not the form.
#
# Loop safety: comment creation/editing fires issue_comment, not issues — the `issues`
# event's activity types contain no comment activity at all, so this workflow (which only
# subscribes to `issues`) cannot be re-triggered by its own comment. Separately, actions
# taken with the default GITHUB_TOKEN never trigger new workflow runs at all, which is
# also what makes the `labeled`/`unlabeled` triggers safe against this workflow's own
# label writes. Swapping in a PAT or GitHub App token would break both properties.

name: Issue Labels

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  issues: write

concurrency:
  group: issue-labels-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  parse:
    name: Parse form (opened only)
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    outputs:
      json: ${{ steps.parse.outputs.jsonString }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse issue form
        id: parse
        # Pinned to a commit SHA, not a tag: this is a third-party action, unlike the
        # actions/* ones elsewhere in this repo which are GitHub-maintained. Keys its
        # output by the form's `id:` fields via template-path, not by scraping rendered
        # markdown headings ourselves — anchors on identifiers we control.
        uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3.2.5
        with:
          template-path: .github/ISSUE_TEMPLATE/issue.yml

  enrich_and_verify:
    name: Apply labels and verify
    runs-on: ubuntu-latest
    needs: parse
    if: always()
    steps:
      - name: Apply parsed labels, then check required categories
        uses: actions/github-script@v7
        # PARSED_JSON is issue-body-derived (user-controlled) content. It MUST be passed
        # via env, not interpolated straight into `script:` as `${{ needs.parse.outputs.json }}`
        # — that form does raw textual substitution before the script is parsed, and
        # JSON.stringify does not escape single quotes. An issue description containing an
        # apostrophe ("don't", "it's" — routine, not contrived) would break out of a
        # single-quoted string literal and execute as JS with issues: write permission.
        # Reading process.env.PARSED_JSON is immune to this: env values are never
        # substituted into script source text.
        env:
          PARSED_JSON: ${{ needs.parse.outputs.json }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            // These must match .github/ISSUE_TEMPLATE/issue.yml's field `id:`s exactly.
            // scripts/check_issue_form_mapping.mjs fails CI if they ever drift apart.
            const PREFIX_FIELDS = {
              component: 'component: ',
              priority: 'priority: ',
              size: 'size: ',
              type: 'type: ',
            };
            const REQUIRED_PREFIXES = ['component:', 'priority:', 'size:', 'type:'];

            // --- Step A output: apply whatever the form parser found -------------
            const rawJson = process.env.PARSED_JSON || '';
            if (rawJson) {
              let parsed = null;
              try { parsed = JSON.parse(rawJson); }
              catch (e) { core.warning(`Could not parse form JSON, skipping apply: ${e}`); }

              if (parsed) {
                // Defensive: the parser may represent a multi-select as an array or as a
                // comma-separated string depending on field type. Normalize either way.
                const toTokens = (v) => {
                  if (v == null) return [];
                  if (Array.isArray(v)) return v.map(String);
                  const s = String(v).trim();
                  if (!s || s === '_No response_') return [];
                  return s.split(',').map(t => t.trim()).filter(Boolean);
                };

                const toApply = new Set();
                for (const [field, prefix] of Object.entries(PREFIX_FIELDS)) {
                  for (const token of toTokens(parsed[field])) {
                    toApply.add(prefix + token);
                  }
                }
                // epic is a single optional checkbox, not a prefixed field — a non-empty
                // selection means the box was ticked.
                if (toTokens(parsed.epic).length > 0) {
                  toApply.add('type: epic');
                }

                if (toApply.size) {
                  await github.rest.issues.addLabels({
                    owner, repo, issue_number, labels: [...toApply],
                  });
                  core.info(`Applied from form: ${[...toApply].join(', ')}`);
                }
              }
            }

            // --- Step B: verify + needs-triage backstop ---------------------------
            // Always re-fetch from the API — never trust the payload snapshot, and
            // never trust that Step A actually ran (it's skipped on edited/labeled/
            // unlabeled, and may have found nothing to apply even on opened).
            const names = (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number, per_page: 100,
            })).map(l => l.name);

            const missing = REQUIRED_PREFIXES.filter(p => !names.some(n => n.startsWith(p)));
            const TRIAGE = 'status: needs-triage';
            const hasTriage = names.includes(TRIAGE);

            if (missing.length && !hasTriage) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [TRIAGE] });
            } else if (!missing.length && hasTriage) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: TRIAGE })
                .catch(() => {}); // already gone is fine
            }

            // --- One idempotent comment, only when something's missing -----------
            const MARKER = '<!-- issue-label-triage -->';
            const existing = (await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })).find(c => c.body?.includes(MARKER));

            if (missing.length) {
              const body = [
                MARKER,
                `### Label triage`,
                ``,
                `Missing: ${missing.join(', ')}`,
                ``,
                `This issue was either created outside the form (e.g. a scripted`,
                `\`gh issue create\`) or the form's response couldn't be parsed. Add the`,
                `missing label(s) by hand — \`${TRIAGE}\` will clear automatically once`,
                `all four categories are present.`,
              ].join('\n');
              if (existing) {
                if (existing.body !== body) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                }
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } else if (existing) {
              const body = `${MARKER}\n### Label triage\n\nResolved — all required labels are present.`;
              if (existing.body !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              }
            }
