name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C relocation-model=dynamic-no-pic"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Catches duplicate mapping keys, which GitHub rejects outright — the run
      # is marked "failed because of a workflow file issue" and no jobs start.
      # Note the limit: if THIS file is the broken one, this step never runs.
      # `make pre-commit` is where that case gets caught, before the push.
      - name: Validate workflow YAML
        run: ./scripts/check_workflow_yaml.sh

      # The design-system guardrails in eslint.config.js (the raw <button> ban,
      # the emoji ban, the @tauri-apps import boundary) were advisory until this
      # job existed — nothing in CI ran eslint. --max-warnings 0 also keeps
      # react-hooks/exhaustive-deps from accumulating silently.
      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

  # No `needs:` — these are shell scripts with no cargo dependency, so gating
  # them behind `fmt` only lengthened the critical path. `ci-success` still
  # requires every job, so nothing loses enforcement.
  boundaries:
    name: Check Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check crate boundaries
        run: ./scripts/check_boundaries.sh

      - name: Upload boundary results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boundary-results
          path: boundary-status.json

  enforcement:
    name: Enforce Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Tauri command placement
        run: ./scripts/check-tauri-commands.sh

      - name: Check frontend IPC allowlist
        run: ./scripts/check-frontend-ipc.sh

      - name: Check transport branching
        run: ./scripts/check_transport_branching.sh

      - name: Check ParamSource matches are exhaustive
        run: ./scripts/check_param_source_exhaustive.sh

      - name: Check every setting has a surface
        run: ./scripts/check_settings_surfaces.sh

      # Added to `make enforce` but not here, so it only ever ran locally —
      # which is the same decorative enforcement it was written to end.
      - name: Check the Rust file-size ratchet
        run: ./scripts/check_rust_complexity.sh

      - name: Check the TypeScript file-size ratchet
        run: ./scripts/check_file_complexity.sh

      # Here rather than beside `make bindings-check`, which cannot substitute
      # for it: a field missing `ts(optional)` or a numeric override
      # regenerates *consistently*, so the diff stays clean and that step goes
      # green with `bigint` sitting in the tree. This reads the annotations and
      # the emitted output directly, and needs no cargo.
      - name: Check ts-rs binding annotations
        run: ./scripts/check_ts_bindings.sh

      # The script has had a `--check` mode since it was written and nothing
      # ever called it, so the tables drifted every time a module was added
      # without one being regenerated by hand.
      - name: Check module tables are current
        run: ./scripts/generate_module_tables.sh --check

      # Its Rust counterpart above is generated, so it cannot drift. The
      # TypeScript tables are hand-written, and `check_readmes.sh` only asks
      # whether a README exists and carries its markers — never whether what
      # it says is true, which is how files get added without reaching one.
      - name: Check README tables match their directories
        run: ./scripts/check_readme_tables.py

  test:
    name: Test (Rust)
    runs-on: ubuntu-latest
    # No `needs:`. This was chained to `clippy` so it would restore the target
    # dir clippy had just populated — but clippy builds `--all-features` and
    # this job builds default features, so on run 32705784511 it inherited
    # 2.57 GB and got 49 of 630 units fresh. Five minutes of serialization for
    # a cache that was 92% inapplicable. Each job has its own shared-key now,
    # so each warms from its own history instead of the other's.
    #
    # Every test step below pipes into `tee` so the output survives as an
    # artifact, and a pipeline reports its *last* command's status — `tee`'s,
    # which is always 0. GitHub's default shell is `bash -e` without pipefail,
    # so a failing `cargo test` was reported as a passing step: three of the
    # six CI runs before this change were green with a failing test inside.
    # `shell: bash` is `bash --noprofile --norc -eo pipefail`, which makes
    # cargo's status the one that counts.
    #
    # Set per job rather than on the workflow: a workflow-level default would
    # also reach `cli-cross-os`, which runs on windows-2022, and switching that
    # leg from pwsh to Git Bash has nothing to do with this problem.
    defaults:
      run:
        shell: bash
    steps:
      # `large-packages` is off: measured on run 32705784511 it spent 77 of this
      # step's 232 seconds to reclaim 1.79 GB, and among what it purged were
      # libgl1, libglx-mesa0 and libdbusmenu-gtk3-4 — which `Install system
      # dependencies` immediately pulls back as appindicator dependencies. The
      # android/dotnet/haskell removals stay: 20 GB in 155 seconds.
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: Lockfile guard
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null

      # Swatinem/rust-cache, as release.yml already uses, with a shared-key
      # per build configuration. The raw actions/cache this replaces used one
      # key for every job: clippy runs --all-features and saved it, test runs
      # default features and restored it, and got 49 of 630 units fresh. And
      # because test hit the key exactly, actions/cache never saved — test's
      # own artifacts were discarded every run, permanently.
      #
      # It also prunes. Those two Linux entries were 2.69 and 2.24 GB of a
      # repo cache budget that had reached 10.09 GB against GitHub's 10 GB
      # ceiling, so the cross-OS entries were being evicted: the Windows leg
      # logged `Cache not found for input keys: Windows-cargo-…, Windows-cargo-`
      # and cold-built the workspace every run. release.yml's rust-cache
      # entries are 0.55-0.80 GB for comparable graphs.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-test"
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Build Web UI
        run: |
          npm ci
          npm run build

      # One build, then one run over it. The fifteen-crate loop this replaces
      # cost 23m15s of a 57m job, and it was not merely repeating work: naming
      # a crate with `-p` changes feature unification, so `cargo test -p
      # gglib-runtime` ran 329 tests where the workspace build runs 352. The 23
      # in llama::{build,config,deps,download,update} sit behind features
      # gglib-cli turns on, so the loop tested a configuration no real build
      # uses and the badge was 23 tests short of the truth.
      #
      # `--no-run` first for two reasons: a compile failure stays
      # distinguishable from a test failure, and the JSON is where the
      # binary-to-package map comes from. It cannot come from the text —
      # `integration_guards` belongs to gglib-agent and says so nowhere.
      - name: Build test binaries
        run: cargo test --no-run --message-format=json > cargo-test-artifacts.json

      # `--no-fail-fast` is a deliberate change, not a transcription. Without
      # it cargo stops at the first failing binary, so on a red run every later
      # crate's file is never written — and because badges.yml keeps files it
      # cannot regenerate, those badges go on serving their last green value.
      # One failure should not hide the state of everything after it.
      #
      # No `--verbose`: nothing parses the per-rustc lines and they were 5324
      # of this step's log. And no `--all-targets`, ever — it would silently
      # drop the doctests, which this step is the only thing running now that
      # the separate `cargo test --doc` step is gone. split_test_output.py
      # fails a green run that produced no Doc-tests sections, which is the
      # standing guard for that.
      - name: Run Rust tests
        run: cargo test --no-fail-fast 2>&1 | tee rust-test-output.txt

      # badges.yml counts per-crate and per-module tests out of
      # rust-test-<crate>.txt. Those used to come from the loop above; they now
      # come from dividing the one run's output by the package each binary
      # belongs to. `always()` so a red suite still publishes what it did run.
      - name: Split test output per crate
        if: always()
        run: ./scripts/split_test_output.py cargo-test-artifacts.json rust-test-output.txt

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          # A glob, not a list. The list this replaces named fifteen crates
          # while badges.yml's ALL_CRATES names sixteen, and the two had
          # already drifted: gglib-sse and gglib-build-info have badges that
          # nothing ever wrote a file for, and gglib-integration-tests had a
          # file nothing reads. Deriving the set from what was actually built
          # cannot drift.
          path: rust-test-*.txt
          retention-days: 30

  bindings:
    name: Bindings Freshness
    runs-on: ubuntu-latest
    # Its own job rather than a step on `test`, which is where it lived on the
    # stated grounds that "the cargo cache is warm in this job". It was not:
    # this builds `--features ts-bindings`, a different feature unification
    # from the one `test` had just produced, and the log shows it recompiling
    # accordingly. Three minutes seventeen of critical path buying nothing that
    # a job running in parallel does not buy for free.
    #
    # The frontend's wire types are generated from the Rust types, and the
    # generated output is committed so the GUI build needs no cargo. That only
    # stays honest if something regenerates and compares — otherwise a changed
    # Rust field ships against a stale TypeScript mirror, which is the whole
    # class of drift the generation exists to end.
    #
    # Staleness only. The annotations themselves are checked by
    # `check_ts_bindings.sh` in `enforcement`, because a missing annotation
    # regenerates consistently and leaves this diff clean.
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-bindings"
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `crates/gglib-axum/src/ui.rs` embeds `../../web_ui` through rust-embed
      # with `debug-embed`, so the crate does not compile without it — this is
      # not optional even though nothing here serves a page.
      - name: Build Web UI
        run: |
          npm ci
          npm run build

      - name: Check generated TypeScript bindings are current
        run: make bindings-check

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    # Off `test` for the same reason as `bindings` above: it sat there for a
    # cargo cache that did not apply to it. rustdoc builds its own artifacts
    # and the job log shows 137 crates recompiling, so the four and a half
    # minutes it took were four and a half minutes of critical path.
    #
    # The same invocation `docs.yml` and `release.yml` deploy with, run on
    # every PR so a broken link is caught by the change that breaks it rather
    # than by whoever next cuts a release. Both of those only fire on a
    # published release or a manual dispatch, so nothing checked rustdoc on the
    # way in until this existed, and the workspace had drifted accordingly.
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install Rust toolchain
        run: rustup show

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-rustdoc"
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `crates/gglib-axum/src/ui.rs` embeds `../../web_ui` through rust-embed
      # with `debug-embed`, so the crate does not compile without it — this is
      # not optional even though nothing here serves a page.
      - name: Build Web UI
        run: |
          npm ci
          npm run build


      - name: Check rustdoc has no warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --exclude gglib-app

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    # No `needs:` — this job is pure npm and finishes in about a minute. It used
    # to wait on a full workspace clippy build it shares nothing with.
    # Same masking as the Rust job: `npm run test:run … | tee` reported `tee`'s
    # exit status, so a failing suite passed the step. See the note there.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Two orphan barrels sat in `src/` because nothing looks for files that
      # nothing imports: `tsc` is happy to compile an island, and eslint only
      # ever sees one file at a time. Scoped to files, dependencies and
      # unlisted imports — the export-level classes are noisier and are not
      # gated yet, deliberately. `npm run deadcode` is the same command.
      - name: Check for dead files and undeclared dependencies
        run: npm run deadcode

      - name: Run TypeScript tests
        run: npm run test:run -- --reporter=json --reporter=default --outputFile=ts-test-results.json 2>&1 | tee ts-test-output.txt

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ts-test-results
          path: |
            ts-test-output.txt
            ts-test-results.json
          retention-days: 30

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # No `needs:` — clippy is a long pole and nothing gates it. It no longer
    # warms anyone else's cache: it builds `--all-features`, which is not what
    # `test` or `cli-cross-os` build, and the shared key that pretended
    # otherwise cost `test` five minutes of waiting for artifacts it could not
    # use.
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Install Rust toolchain
        run: rustup show

      # Its own shared-key, for the reason spelled out on the `test` job: one
      # key across four different feature sets meant every job but the first
      # restored artifacts it could not use.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-clippy"
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Build Web UI
        run: |
          npm ci
          npm run build

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  cli-cross-os:
    name: CLI Check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    # Same reason as `clippy-cross-os` below, and no longer any other: these
    # legs take 7-13 minutes each on three runners, and there is no sense
    # spending them on a tree ubuntu clippy has already rejected. It was never
    # about the cache here either — the key is per-OS, so the Linux leg was the
    # only one that could ever have shared, and it does not now.
    needs: [clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      # Its own shared-key, for the reason spelled out on the `test` job: one
      # key across four different feature sets meant every job but the first
      # restored artifacts it could not use.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-cli-${{ matrix.target }}"
          cache-on-failure: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Check gglib-cli compilation
        run: cargo test -p gglib-cli --no-run

  # The `clippy` job above runs on ubuntu only, so until now no lint had ever
  # seen the inside of a `#[cfg(windows)]` block. `cli-cross-os` visits all
  # three platforms but only compiles — `cargo test --no-run` does not lint.
  #
  # Running it turned up four kinds of thing in code that had been there for
  # months: an import unused on Windows, an unreadable literal, enum variants
  # dead on Windows, and a function that could be `const` there.
  #
  # Linux is deliberately absent: the `clippy` job already covers it with the
  # same invocation, and repeating it here would only spend runner minutes.
  #
  # Whole workspace rather than the crates that carry `#[cfg]`. Two reasons:
  # a hand-kept crate list goes stale the first time someone adds platform
  # code to a crate not on it, and — measured while writing this — naming a
  # subset changes feature unification, flipping rustls off `ring` and onto
  # `aws-lc-sys`, which then wants a C toolchain. The whole workspace is both
  # the honest scope and the one that builds. It needs the Web UI for the same
  # reason the `clippy` job does: `gglib-app` embeds it.
  clippy-cross-os:
    name: Clippy (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    # Not for the cache — the key is per-OS, so there is nothing to share.
    # This is to avoid spending macOS and Windows minutes on a tree that
    # ubuntu clippy has already rejected.
    needs: [clippy]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      # Its own shared-key, for the reason spelled out on the `test` job: one
      # key across four different feature sets meant every job but the first
      # restored artifacts it could not use.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-clippy-${{ matrix.target }}"
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Build Web UI
        run: |
          npm ci
          npm run build

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs: [boundaries, bindings, enforcement, quality, rustdoc, test, test-frontend, clippy, clippy-cross-os, fmt, cli-cross-os]
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs were cancelled"
            exit 1
          fi
          echo "All CI jobs passed successfully"

  release:
    name: Release
    needs: [ci-success]
    if: always() && needs.ci-success.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      # A called workflow cannot exceed the caller's grant, so release.yml's own
      # `attestations: write` is capped here. Without this line the provenance
      # step fails on the real release path (push to main) while still working
      # on a direct workflow_dispatch — which is the worst way to find out.
      attestations: write
      issues: write
      pull-requests: write
      pages: write
      id-token: write
      deployments: write
    uses: ./.github/workflows/release.yml
    with:
      test_run: false
    secrets: inherit