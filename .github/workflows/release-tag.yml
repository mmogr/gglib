# The tagging half of a release, called by ci.yml's `release` job after CI
# passes on a push to main or to a maintenance line, release/X.Y.x, so its
# check shows on the commit. When the branch's version has no `v<version>`
# tag it tags the commit that set that version, makes the GitHub
# (pre)release, and dispatches release.yml, which builds and publishes the
# assets in a run of its own. Nothing that cancels this CI run can then
# cancel the builds.
#
# This tags every candidate. release-please.yml never tags, and promote.yml
# tags a stable version itself, from the candidate's tag, so a promotion
# never comes this way.
#
# A stable version comes this way only when it was set on a branch by hand.
# It is then held to what Promote holds a promotion to, before it is tagged:
# it is its last candidate with the version alone changed, and it is not
# below the newest stable. Its release is made as Promote makes one, the
# latest, with notes since the stable version before it. And the branch
# `stable`, which follows the newest stable version (promote.yml), is moved
# to it, last, so nothing about the branch can stop a release. main does not
# hold `stable`'s tip, a commit Promote made, so from main the move is to a
# commit joining the two: the stable version's tree, with the tagged commit
# and `stable`'s tip as its parents. `stable` still only moves forward, and
# a clone of it updates with `git pull`.
#
# main cuts the next minor's or major's candidates and a line its own
# version's patches, and scripts/release_lines.py holds each branch to its
# own before anything is tagged: a line tags nothing outside its X.Y, and
# main tags nothing inside a line that has a branch. A line runs this file
# as the line holds it, since ci.yml calls it by path.
#
# Run by hand, it tags without waiting for CI: the same steps on the branch
# it is run on, as it is now, and then the release PR workflow for that
# branch, which otherwise follows CI. That is the maintainer's shortcut past
# a CI run that takes an hour, taken on their own judgement of the tree:
# nothing here has tested it. A CI run that finishes afterwards finds the
# tag and releases nothing twice.

name: Release tag

on:
  workflow_call:
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # GitHub's default is `bash -e`; this adds pipefail.
    shell: bash

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      bump: ${{ steps.bump.outputs.sha }}
      previous: ${{ steps.newest.outputs.previous }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The whole history and every tag: the bump commit is found in the
          # history, and a stable version is compared with its last RC's tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Get current version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A prerelease is any version carrying a -alpha, -beta or -rc suffix.
          if [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # Asked of the remote rather than the checkout's tags, so a tag made
          # since the checkout counts.
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already tagged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: v$VERSION"
          fi

      # A line's version stays inside its X.Y, and main's outside every line
      # that has a branch. The release PR's guard (release-please.yml) says
      # the same before a merge; this is for a version set by hand or by an
      # admin's push that no release PR carried. Only for a version about to
      # be tagged: a branch's tagged version is its own by then, and main's
      # last candidate reads as inside a line the moment the line is cut from
      # its stable version. Before anything is tagged, so a refusal leaves no
      # tag and no release behind.
      - name: Require the version to belong to this branch
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git ls-remote --heads origin 'refs/heads/release/*' > "$RUNNER_TEMP/release-branches.txt"
          scripts/release_lines.py guard-tag --branch "$BRANCH" --version "$VERSION" --branches "$RUNNER_TEMP/release-branches.txt"

      # The tag goes on the commit that set the version, not on this run's
      # commit. When runs overlap, or a run is cancelled and a later one picks
      # the version up, the run that tags can be testing a newer commit; the
      # bump commit is the same whichever run gets there.
      #
      # -G matches a line the commit added or removed. The newest such commit
      # is the one that added it, since the branch still carries the line.
      - name: Find the commit that set the version
        id: bump
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ver_re=$(printf '%s' "$VERSION" | sed 's/[.[\*^$/]/\\&/g')
          bump=$(git log -1 --format=%H -G"^version = \"${ver_re}\"\$" -- Cargo.toml)
          if [ -z "$bump" ]; then
            echo "::error::no commit in this branch's history sets version = \"$VERSION\" in Cargo.toml"
            exit 1
          fi
          git show "$bump:Cargo.toml" > "$RUNNER_TEMP/bump-Cargo.toml"
          if [ "$(grep -m1 '^version = ' "$RUNNER_TEMP/bump-Cargo.toml")" != "version = \"$VERSION\"" ]; then
            echo "::error::$bump was found as the commit that set $VERSION, but its Cargo.toml says otherwise"
            exit 1
          fi
          echo "sha=$bump" >> "$GITHUB_OUTPUT"
          echo "v$VERSION will tag $bump"

      # A stable version is never below the newest stable: the stable
      # channels each carry one version, and release.yml would replace the
      # newer with the older. promote.yml refuses that for a promotion; this
      # refuses it for a version set to stable by hand. The same script names
      # the stable version before this one, where the release's notes start.
      - name: Require a stable release to be the newest
        id: newest
        if: steps.version.outputs.changed == 'true' && steps.version.outputs.is-prerelease != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -l 'v*' > "$RUNNER_TEMP/tags.txt"
          scripts/release_lines.py previous --stable "$VERSION" --tags "$RUNNER_TEMP/tags.txt" | tee -a "$GITHUB_OUTPUT"

      # A stable version is released only as its last release candidate with
      # the version changed. promote.yml makes one that way from the
      # candidate's tag and never comes here, so this guards a version set
      # to stable on a branch by hand. Checked before anything is tagged, so a
      # refusal leaves no tag and no release behind; the script's header
      # says how to recover. Judged on the bump commit's own tree, so a bump
      # whose run was overtaken is not judged on a newer one.
      - name: Require a stable release to match its last RC
        if: steps.version.outputs.changed == 'true' && steps.version.outputs.is-prerelease != 'true'
        env:
          BUMP: ${{ steps.bump.outputs.sha }}
        run: |
          git checkout --detach "$BUMP"
          scripts/check_rc_promotion.sh

  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    permissions:
      # The tag and the release.
      contents: write
      # The release PR's labels, below: the issues list finds it, and a
      # label on a pull request needs pull-requests: write even through the
      # issues endpoints (issues: write alone got a 403 on v0.29.0-rc.4).
      issues: write
      pull-requests: write
      # The dispatch of release.yml.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.check-version.outputs.version }}
      BUMP: ${{ needs.check-version.outputs.bump }}
    steps:
      # Through the API, which creates the tag only if no tag of that name
      # exists. Two overlapping runs on a branch can both find the version
      # untagged; the one that loses gets a 422 and stops here, and the
      # winner makes the release and dispatches the build.
      #
      # A re-run of this job after it failed past this step meets its own
      # tag, on the bump commit, and carries on: the release is made if it
      # is missing, and the build dispatched again (a second dispatch waits
      # in release.yml's concurrency group, then replaces the assets as a
      # whole). The attempt number is what tells that from a lost race,
      # where the loser is on its first attempt and the winner's release
      # may not exist yet.
      # The tag is made with the App's token. GITHUB_TOKEN may create a
      # ref only at the run's own commit: at any other it gets a 403 with
      # `X-Accepted-Github-Permissions: contents=write,workflows=write`, a
      # permission it never has. The bump commit is the run's own only when
      # nothing merged after the release PR before this ran, which a hand
      # run or a busy branch breaks. The App has that permission (its
      # settings: "Workflows: read and write").
      - name: App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Tag the bump commit
        id: tag
        env:
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if out=$(gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$BUMP" 2>&1); then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "Tagged $BUMP as v$VERSION"
            exit 0
          fi
          echo "$out"
          # A 422 also answers a bad sha, so only an existing tag counts.
          if ! grep -q 'HTTP 422' <<< "$out"; then exit 1; fi
          at=$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --jq .object.sha) || exit 1
          if [ "$at" = "$BUMP" ] && [ "$ATTEMPT" -gt 1 ]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already on $BUMP from an earlier attempt of this run; carrying on from there"
            exit 0
          fi
          echo "tagged=false" >> "$GITHUB_OUTPUT"
          echo "::notice::another run tagged v$VERSION; this run makes no release and dispatches nothing"

      # The notes are generated, sorted by .github/release.yml. A stable
      # version's run from the stable version before it: --notes-start-tag
      # pins the range to that tag, where GitHub starts a stable release's
      # notes anyway. --latest says outright what check-version made sure
      # of: this is the newest stable version, so it is the one the release
      # page and the badges point at (GitHub's default weighs the date and
      # the version).
      - name: Create GitHub Release
        if: steps.tag.outputs.tagged == 'true'
        env:
          PRERELEASE: ${{ needs.check-version.outputs.is-prerelease }}
          PREVIOUS: ${{ needs.check-version.outputs.previous }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "the release for v$VERSION exists already"
            exit 0
          fi
          args=(--title "Release v$VERSION" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--notes-start-tag "$PREVIOUS" --latest)
          fi
          gh release create "v$VERSION" "${args[@]}"

      # From main, whose release.yml is the current one, also for a line's
      # candidate; it checks out the tag. A failed build is re-run with the
      # same command.
      - name: Dispatch the build
        if: steps.tag.outputs.tagged == 'true'
        run: gh workflow run release.yml --ref main -f tag="v$VERSION"

      # release-please.yml never tags (it runs only release-please's
      # `release-pr` command), so it cannot see that the release PR it opened
      # has been released, and it opens no other while a merged release PR is
      # labelled `autorelease: pending`. Swapping that label for `autorelease: tagged`
      # is how a release tells it. Only the merged PR titled for this version
      # on this branch is touched (release-please titles it
      # `chore(<branch>): release <version>`); a promotion has no such PR, and
      # nothing changes. Allowed to fail, so a label can never hold up the
      # build: if it fails, release-please.yml stops with an error naming the
      # label.
      - name: Mark the release PR as tagged
        if: steps.tag.outputs.tagged == 'true'
        continue-on-error: true
        env:
          BRANCH: ${{ github.ref_name }}
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = `chore(${process.env.BRANCH}): release ${process.env.VERSION}`;
            // The issues list rather than search, which can lag behind a label.
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'closed', labels: 'autorelease: pending', per_page: 100,
            });
            for (const item of items) {
              if (!item.pull_request?.merged_at || item.title !== title) continue;
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: item.number, name: 'autorelease: pending',
              });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: item.number, labels: ['autorelease: tagged'],
              });
              core.info(`#${item.number} is now labelled autorelease: tagged`);
            }

      # Run by hand there is no CI run for release-please.yml to follow, so
      # it is started here, for this branch, after the relabel above: its
      # gate reads that label. From main, whose release-please.yml is the one
      # that runs after CI too.
      - name: Refresh the release PR
        if: github.event_name == 'workflow_dispatch' && steps.tag.outputs.tagged == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run release-please.yml --ref main -f branch="$BRANCH"

      # Last, so that nothing here can stop a release, and whenever the tag
      # was made, even when the release or the dispatch after it failed:
      # `stable` follows the newest stable tag, and check-version made sure
      # this is it. Only for a stable version: a candidate never moves the
      # branch. Through the API with the App's token, which the branch's
      # ruleset lets past; there is no checkout in this job.
      #
      # A fast-forward to the tag's commit when that commit descends from
      # `stable`'s tip. main's does not: `stable`'s tip is a commit Promote
      # made, which main does not hold, so `stable` moves to a new commit
      # with the tag's tree and two parents, the tag's commit and where
      # `stable` was. That is still a fast-forward for the branch, and the
      # tree a build from it reads is the stable version's; the next
      # promotion takes that commit as its second parent.
      #
      # Before a join, the version `stable` reads is compared with this one,
      # and a `stable` that is past it is left where it is. check-version
      # held this version to the newest when it was tagged, but this job can
      # be run again later, after a newer stable has shipped, and a join then
      # would put the older version's tree on the branch.
      #
      # A refusal fails the run and names the push that finishes it by hand:
      # the same join, made in a clone. Re-running the job would also move
      # the branch, and build the release again.
      - name: Move the stable branch
        if: ${{ !cancelled() && steps.tag.outputs.tagged == 'true' && needs.check-version.outputs.is-prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          by_hand="An admin moves it with: git fetch origin --tags && git push origin \"\$(git commit-tree 'v$VERSION^{tree}' -p 'v$VERSION^{commit}' -p origin/stable -m 'chore(release): stable follows v$VERSION'):refs/heads/stable\""
          if ! tip=$(gh api "repos/$GH_REPO/git/ref/heads/stable" --jq .object.sha 2> /dev/null); then
            if gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/heads/stable -f sha="$BUMP" > /dev/null; then
              echo "✓ stable was created at v$VERSION"
              exit 0
            fi
            echo "::error::v$VERSION is tagged, but the stable branch could not be read or created. If there is none, an admin creates it with: git fetch origin --tags && git push origin 'refs/tags/v$VERSION^{commit}:refs/heads/stable'. Otherwise: $by_hand"
            exit 1
          fi
          target=$BUMP
          if [ "$tip" != "$BUMP" ]; then
            status=$(gh api "repos/$GH_REPO/compare/$tip...$BUMP" --jq .status) || status=unknown
            # A second attempt of this run finds `stable` past the tag's commit already.
            if [ "$status" = behind ] || [ "$status" = identical ]; then
              echo "✓ stable holds v$VERSION already"
              exit 0
            fi
            if [ "$status" != ahead ]; then
              toml=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GH_REPO/contents/Cargo.toml?ref=$tip") || toml=
              at=$(grep -m1 '^version = ' <<< "$toml" | sed -E 's/version = "(.*)"/\1/') || at=
              if [ -z "$at" ]; then
                echo "::error::v$VERSION is tagged, but the version the stable branch reads could not be found, so the branch was not moved. If it is below $VERSION: $by_hand"
                exit 1
              fi
              if [ "$at" != "$VERSION" ] && [ "$(printf '%s\n' "$at" "$VERSION" | sort -V | tail -n 1)" = "$at" ]; then
                echo "::notice::stable reads $at, which is past v$VERSION; it stays there"
                exit 0
              fi
              tree=$(gh api "repos/$GH_REPO/git/commits/$BUMP" --jq .tree.sha) || tree=
              target=
              if [ -n "$tree" ]; then
                target=$(gh api -X POST "repos/$GH_REPO/git/commits" -f message="chore(release): stable follows v$VERSION" \
                  -f tree="$tree" -f "parents[]=$BUMP" -f "parents[]=$tip" --jq .sha) || target=
              fi
              if [ -z "$target" ]; then
                echo "::error::v$VERSION is tagged, but the commit joining it to the stable branch could not be made. $by_hand"
                exit 1
              fi
              echo "stable was at $tip, which v$VERSION does not descend from; $target joins them"
            fi
          fi
          if ! gh api -X PATCH "repos/$GH_REPO/git/refs/heads/stable" -f sha="$target" -F force=false > /dev/null; then
            echo "::error::v$VERSION is tagged, but the stable branch did not move. $by_hand"
            exit 1
          fi
          echo "✓ stable is at v$VERSION"
