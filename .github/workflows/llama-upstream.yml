# Reports what moving the llama.cpp pin would meet, in one living issue.
#
# gglib installs the release `PINNED_LLAMA_RELEASE` names
# (crates/gglib-runtime/src/llama/download/mod.rs), and ADR 0001 makes moving
# it a deliberate event: bump, run the suite, ship with the differences
# observed. llama.cpp cuts a release on nearly every merge, so "what changed"
# is a thousand commits within a couple of months, and the reading was not
# being taken. This workflow takes it.
#
# Weekly, or on demand, scripts/llama_upstream.py compares the pin with
# upstream's newest release: the commits in subsystems gglib depends on, the
# `--help` diff, a launch of the candidate with the flags gglib emits, the
# release assets gglib downloads, the sampler defaults ADR 0003 defers to, and
# the diff of every upstream file an ADR cites. That evidence is deterministic
# and goes in the issue as collected. The verdict, whether gglib must change
# and what the change is, is a reading of the evidence against gglib's code
# and ADRs, and Claude writes it when ANTHROPIC_API_KEY is set; without the
# key the issue carries the evidence and says the verdict was not taken.
# scripts/llama_upstream_verdict.py asks for it through the Claude Agent SDK,
# not the Claude Code GitHub Action: the API credits a Claude Max or Team plan
# includes cover the Agent SDK run with an API key, and not the Action.
#
# One issue, edited in place: the title names the pin and the candidate, each
# run replaces the body, and a comment marks a run whose candidate moved. The
# run that finds the pin caught up closes it. Nothing here opens a pull
# request or touches a branch; the bump stays a person's commit.
#
# The checkout and the issue use the GitHub App token update-deps.yml uses,
# so the issue is the app's and issue-labels.yml runs on it. The labels are
# set at creation because that workflow's parse step reads the issue form,
# which this issue is not, and its verify step wants every category present.

name: llama.cpp upstream

on:
  schedule:
    # Monday 06:17 Australia/Brisbane, after Dependabot's 06:00. A minute off
    # the hour, which GitHub's scheduler is slowest on.
    - cron: '17 20 * * 0'
  workflow_dispatch:
    inputs:
      candidate:
        description: 'The llama.cpp release to compare the pin with, or latest'
        type: string
        required: false
        default: latest

permissions: {}

concurrency:
  group: llama-upstream
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # `secrets.*` cannot appear in an `if`; this can.
  HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
  # The Claude model that reads the verdict. Any model id from
  # https://platform.claude.com/docs/en/about-claude/models/overview.
  VERDICT_MODEL: claude-opus-5-5
  # Where a reading stops, in estimated US dollars. The estimate can pass it
  # by a little; the organisation's monthly spend limit is the hard cap.
  VERDICT_BUDGET_USD: 5

jobs:
  report:
    name: Compare the pin with upstream
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Nothing pushes, and the verdict step runs a model with a shell.
          persist-credentials: false

      - name: Clone llama.cpp
        # Commits and tags only; the script fetches the blobs it diffs.
        run: git clone --quiet --filter=tree:0 --bare https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp.git"

      - name: Collect the evidence
        id: collect
        env:
          CANDIDATE: ${{ inputs.candidate || 'latest' }}
        run: |
          python3 scripts/llama_upstream.py \
            --repo "$RUNNER_TEMP/llama.cpp.git" \
            --out "$RUNNER_TEMP/report" \
            --candidate "$CANDIDATE"
          python3 - "$RUNNER_TEMP/report/facts.json" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          f = json.load(open(sys.argv[1]))
          print(f"pin={f['pin']}")
          print(f"candidate={f['candidate']}")
          print(f"up_to_date={'true' if f['up_to_date'] else 'false'}")
          EOF

      - name: Upload the evidence
        if: steps.collect.outputs.up_to_date == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: llama-upstream-${{ steps.collect.outputs.candidate }}
          path: ${{ runner.temp }}/report
          retention-days: 90

      - name: Read the verdict
        id: verdict
        if: steps.collect.outputs.up_to_date == 'false' && env.HAS_ANTHROPIC_KEY == 'true'
        # A verdict that fails to arrive is reported as missing, not as a
        # failed run: the evidence is still worth an issue.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/pip" install --quiet claude-agent-sdk==0.2.165
          "$RUNNER_TEMP/sdk/bin/python" scripts/llama_upstream_verdict.py \
            --report "$RUNNER_TEMP/report" \
            --llama "$RUNNER_TEMP/llama.cpp.git" \
            --out "$RUNNER_TEMP/verdict.json" \
            --model "$VERDICT_MODEL" \
            --max-budget-usd "$VERDICT_BUDGET_USD"

      - name: Write the issue body
        if: steps.collect.outputs.up_to_date == 'false'
        env:
          # The script writes it either way: the verdict, or why there is none.
          VERDICT_FILE: ${{ runner.temp }}/verdict.json
          VERDICT_RAN: ${{ steps.verdict.outcome }}
          HAS_KEY: ${{ env.HAS_ANTHROPIC_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ runner.temp }}/report
        run: |
          python3 - > "$RUNNER_TEMP/body.md" <<'EOF'
          import json, os

          report = os.environ["REPORT"]
          facts = json.load(open(f"{report}/facts.json"))
          pin, cand = facts["pin"], facts["candidate"]
          try:
              verdict = json.load(open(os.environ["VERDICT_FILE"]))
          except (OSError, ValueError):
              verdict = None

          out = []
          if verdict and isinstance(verdict, dict) and verdict.get("body"):
              out.append(f"**{verdict.get('verdict', 'unclear').capitalize()}.** {verdict.get('summary', '')}".strip())
              out.append("")
              out.append(verdict["body"].strip())
          elif os.environ.get("HAS_KEY") != "true":
              out.append("No verdict: `ANTHROPIC_API_KEY` is not set, so the evidence below was not read against gglib's code and ADRs.")
          else:
              out.append(f"No verdict: the reading step did not return one (outcome `{os.environ.get('VERDICT_RAN')}`); see the run.")
              reason = verdict.get("error") if isinstance(verdict, dict) else None
              if reason:
                  out.append("")
                  out.append(f"> {reason}")
          out.append("")
          out.append("## Evidence")
          out.append("")
          out.append(open(f"{report}/report.md").read().strip())
          out.append("")
          out.append("## Moving the pin")
          out.append("")
          out.append(f"- Try it first: `GGLIB_LLAMA_RELEASE={cand} gglib config llama install`, then `gglib config llama status`.")
          out.append(f"- Bump: set `PINNED_LLAMA_RELEASE` to `{cand}` in `crates/gglib-runtime/src/llama/download/mod.rs`, with any change named above, in one pull request whose message says what was observed (ADR 0001).")
          out.append("- The readings an ADR says to take on a real model are not taken here; take the ones named above before merging.")
          out.append("")
          out.append(f"The full evidence is the `llama-upstream-{cand}` artifact of [the run]({os.environ['RUN_URL']}), kept 90 days. Edited in place by the llama.cpp upstream workflow on each run.")
          body = "\n".join(out)
          limit = 60000
          if len(body) > limit:
              body = body[:limit] + "\n\n… truncated to fit an issue; the artifact has the rest."
          print(body)
          EOF
          wc -c "$RUNNER_TEMP/body.md"

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PIN: ${{ steps.collect.outputs.pin }}
          CANDIDATE: ${{ steps.collect.outputs.candidate }}
          UP_TO_DATE: ${{ steps.collect.outputs.up_to_date }}
        run: |
          existing=$(gh issue list --state open --label automated \
            --search '"llama.cpp: pin" in:title' --json number,title --limit 1)
          number=$(jq -r '.[0].number // empty' <<<"$existing")
          old_title=$(jq -r '.[0].title // empty' <<<"$existing")
          title="llama.cpp: pin $PIN, upstream $CANDIDATE"

          if [ "$UP_TO_DATE" = true ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The pin, \`$PIN\`, is upstream's newest release."
              echo "Closed #$number: the pin is current." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The pin, $PIN, is upstream's newest release; nothing to report." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          if [ -z "$number" ]; then
            url=$(gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" \
              --label "component: runtime" --label "priority: medium" --label "size: s" \
              --label "type: chore" --label dependencies --label automated)
            echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            if [ "$old_title" != "$title" ]; then
              gh issue comment "$number" --body "Upstream moved: now \`$CANDIDATE\` (was \`${old_title##* }\`). The body above is this run's."
            fi
            echo "Updated #$number for $CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          fi
