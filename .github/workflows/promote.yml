# Promotes a branch's release candidate to the stable release: X.Y.Z-rc.N
# becomes X.Y.Z and nothing else changes. Run it from Actions -> Promote ->
# Run workflow, or with `gh workflow run promote.yml -R mmogr/gglib`, once
# the candidate has released and while the branch is still exactly that
# candidate.
#
# The stable version lands on the branch. This workflow moves the version on
# the branch's tip and opens a pull request, which merges itself once CI
# passes, since there is nothing in it to review: check_rc_promotion.sh
# proves the code is the candidate's here, CI proves it again on the pull
# request (ci.yml's `scope` job), and CI's release job (release-tag.yml)
# once more before it tags. After the merge that job tags vX.Y.Z on the
# merge's commit, makes the release, dispatches release.yml and moves the
# branch `stable`; each stable channel waits for its approval as before.
# So the branch reads X.Y.Z from the promotion until its next candidate, and
# the stable tag is in its history, where release-please finds it.
#
# The branch must stand still between its last candidate and the promotion.
# A stable release ships its last candidate unchanged, so anything merged
# after the candidate needs another candidate first: this workflow refuses,
# naming what merged, and the release PR is already proposing rc.N+1. The
# same holds while the promotion's pull request waits for CI: the ruleset
# will not merge it behind its branch, and brought up to date it fails CI's
# check. Cut the next candidate and run Promote again; that updates the same
# pull request.
#
# release-please cannot do this: with no commit since the candidate's tag it
# opens no pull request. Once the stable version is on the branch it reads
# the next cycle from there by itself: the next minor's rc.1 after a feat or
# a breaking change, the next patch's after fixes alone.
#
# A candidate comes from main, the next minor's or major's, or from a
# maintenance line release/X.Y.x, that version's next patch (CONTRIBUTING,
# "Maintenance lines"); `branch` says which, and the pull request goes into
# that branch. scripts/release_lines.py holds a promotion to two rules. The
# candidate must be the newest of its version, and that version unshipped.
# And a version below the newest stable is never promoted: the stable
# channels (apt, dnf, pacman, the AUR, Homebrew and the docs site) each
# carry one version, and release.yml would replace the newer with the older.
# That is the rule that only the newest stable line is maintained.
#
# The pull request is opened with the GitHub App token, as update-deps.yml's
# is: a pull request opened with GITHUB_TOKEN starts no workflows, so CI
# would never run on it.

name: Promote

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch whose candidate to promote: main, or a line release/X.Y.x'
        required: false
        default: main
        type: string
      dry_run:
        description: 'Dry run: make the promotion and check it, then push nothing and open no pull request'
        required: false
        default: false
        type: boolean

# Everything that writes uses the App's token.
permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

defaults:
  run:
    # GitHub's default is `bash -e`; this adds pipefail.
    shell: bash

jobs:
  promote:
    name: Promote the release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: ${{ inputs.branch }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The branch's tip, with its whole history for the candidate's tag. The
      # App's token stays in the checkout for the push.
      - name: Checkout the branch
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch tags
        run: git fetch --force --tags

      # Only main and the lines release.
      - name: Require a branch that releases
        run: scripts/release_lines.py line --branch "$BRANCH"

      # The candidate is the version the branch carries. It must be tagged
      # and released, the newest candidate of its version, and that version
      # unshipped; and the stable version it makes must not be below the
      # newest stable, since the stable channels would be downgraded.
      # scripts/release_lines.py says each, before anything is changed. It
      # also names the stable version before this one, which the changelog's
      # heading and the release's notes start from.
      - name: Read the branch's candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RC=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if ! [[ "$RC" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::$BRANCH carries $RC, which is not a release candidate X.Y.Z-rc.N, so there is nothing to promote. Merge the release PR to cut a candidate, let it release, then run Promote."
            exit 1
          fi
          git tag -l 'v*' > "$RUNNER_TEMP/tags.txt"
          scripts/release_lines.py candidate --input "v$RC" --tags "$RUNNER_TEMP/tags.txt" > "$RUNNER_TEMP/candidate.txt"
          cat "$RUNNER_TEMP/candidate.txt" >> "$GITHUB_OUTPUT"
          STABLE=$(sed -n 's/^stable=//p' "$RUNNER_TEMP/candidate.txt")
          scripts/release_lines.py previous --stable "$STABLE" --tags "$RUNNER_TEMP/tags.txt" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$RC" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v$RC is tagged but has no release, so it was never built. Re-run the failed jobs of the CI run that tagged it, then run Promote again."
            exit 1
          fi
          echo "✓ $BRANCH carries v$RC, which becomes $STABLE"

      # A stable release ships its last candidate unchanged, so the branch's
      # tip must be the candidate's commit. check_rc_promotion.sh would
      # refuse the same tree below; this says what merged and what to do.
      # A promotion's pull request left open from an earlier run can no
      # longer be right, and is closed.
      - name: Require the branch to be its candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          STABLE: ${{ steps.candidate.outputs.stable }}
        run: |
          if ! git merge-base --is-ancestor "refs/tags/$CANDIDATE" HEAD; then
            echo "::error::$CANDIDATE is not in $BRANCH's history, so $BRANCH cannot be promoted as it. Check which branch cut the candidate and run Promote with that branch."
            exit 1
          fi
          count=$(git rev-list --count "refs/tags/$CANDIDATE..HEAD")
          if [ "$count" = 0 ]; then
            echo "✓ $BRANCH is exactly $CANDIDATE"
            exit 0
          fi
          {
            echo "## $STABLE was not promoted"
            echo
            echo "$count commit(s) merged into \`$BRANCH\` after \`$CANDIDATE\`, and a stable release ships its last candidate unchanged:"
            echo
            git log --format='- %h %s' -n 20 "refs/tags/$CANDIDATE..HEAD"
            if [ "$count" -gt 20 ]; then echo "- and $((count - 20)) more"; fi
            echo
            echo "Merge the release PR to cut the next candidate, let it release, then run Promote again."
          } >> "$GITHUB_STEP_SUMMARY"
          stale=$(gh pr list -R "$GITHUB_REPOSITORY" --base "$BRANCH" --head "promote-v$STABLE" --state open --json number --jq '.[0].number // empty' || true)
          if [ -n "$stale" ]; then
            gh pr close "$stale" -R "$GITHUB_REPOSITORY" --delete-branch \
              --comment "$BRANCH has moved past $CANDIDATE, so this promotion no longer matches a candidate. Promote opens another once the next candidate has released." || true
          fi
          echo "::error::$count commit(s) merged into $BRANCH after $CANDIDATE, and a stable release ships its last candidate unchanged. Merge the release PR to cut the next candidate, let it release, then run Promote again. The run's summary lists them."
          exit 1

      - name: Promote the version
        id: promote
        env:
          PREVIOUS: ${{ steps.candidate.outputs.previous }}
        run: python3 scripts/promote.py --previous "$PREVIOUS" | tee -a "$GITHUB_OUTPUT"

      # As release-please.yml locks a candidate's version.
      - name: Lock the stable version
        uses: ./.github/actions/lock-the-version
        with:
          version: ${{ steps.promote.outputs.stable }}

      # CI makes the same check on the pull request and release-tag.yml
      # before it tags. Making it here too means a promotion they would
      # refuse is never opened. After the lockfiles, which a promotion also
      # changes.
      - name: Require the promotion to match the candidate
        run: scripts/check_rc_promotion.sh

      # One commit on top of the branch's tip, by the App, as
      # release-please.yml commits the release PR's lockfiles. Only the files
      # a promotion moves are taken, and anything else left in the tree stops
      # the run. Its message is the pull request's title, so the squash keeps
      # it: release-tag.yml tags the commit that carries it, and
      # release-please reads the next cycle from the commits after it.
      - name: Commit the promotion
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          RC: ${{ steps.promote.outputs.rc }}
          STABLE: ${{ steps.promote.outputs.stable }}
        run: |
          git add Cargo.toml package.json .release-please-manifest.json Cargo.lock package-lock.json CHANGELOG.md
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::the promotion left changes outside the files it moves:"
            git status --porcelain
            exit 1
          fi
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          git -c user.name="${SLUG}[bot]" -c user.email="${id}+${SLUG}[bot]@users.noreply.github.com" \
            commit -q -m "chore(release): promote $RC to $STABLE"
          git log -1 --format='%H%n%an <%ae>%n%s' HEAD
          git diff --stat "HEAD^1" HEAD

      - name: Dry run
        if: inputs.dry_run
        env:
          CANDIDATE: ${{ steps.candidate.outputs.candidate }}
          STABLE: ${{ steps.promote.outputs.stable }}
        run: |
          {
            echo "## Dry run: v$STABLE from $CANDIDATE"
            echo
            echo "The promotion was made and checked. Nothing was pushed and no pull request was opened."
            echo
            echo '```'
            git diff --stat "refs/tags/$CANDIDATE" HEAD
            echo '```'
            echo
            echo "A real run opens this as a pull request into \`$BRANCH\`, which merges itself once CI passes. CI's release job then tags v$STABLE on the merge and builds it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::dry run of v$STABLE from $CANDIDATE: nothing was pushed and no pull request was opened"

      # The head branch is named for the stable version, so a second run for
      # the same version (after another candidate, say) replaces the first's
      # commit and keeps its pull request. The labels are the ones the release
      # PR carries: `Label Check` passes them, and .github/release.yml keeps
      # the pull request out of the release's notes.
      - name: Open the pull request
        id: pr
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RC: ${{ steps.promote.outputs.rc }}
          STABLE: ${{ steps.promote.outputs.stable }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          head="promote-v$STABLE"
          title="chore(release): promote $RC to $STABLE"
          git push --force origin "HEAD:refs/heads/$head"
          {
            echo "$RC becomes $STABLE, and nothing else changes. Cargo.toml, package.json, the release-please manifest and both lockfiles move only their version, and CHANGELOG.md gains a heading for $STABLE. \`scripts/check_rc_promotion.sh\` checked that against the tag v$RC; CI checks it again here, and once more before it tags."
            echo
            echo "This pull request merges itself once CI passes. CI then tags v$STABLE on the merge, and each stable channel waits for its approval."
            echo
            echo "It merges only while \`$BRANCH\` is still v$RC. If something else merges first, cut the next candidate and run Promote again."
            echo
            echo "Opened by the Promote workflow: $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          number=$(gh pr list -R "$GITHUB_REPOSITORY" --base "$BRANCH" --head "$head" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" -R "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            url=$(gh pr create -R "$GITHUB_REPOSITORY" --base "$BRANCH" --head "$head" --title "$title" \
              --body-file "$RUNNER_TEMP/body.md" --label version-bump --label automated)
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          {
            echo "## v$STABLE from v$RC"
            echo
            echo "Opened #$number into \`$BRANCH\`. It merges itself once CI passes; CI's release job then tags v$STABLE, makes the release and dispatches release.yml."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto --squash
