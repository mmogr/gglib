name: Coverage

on:
  push:
    branches: [main]

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # `… | tee` reports tee's exit status, not the test runner's, under
    # GitHub's default `bash -e`. `shell: bash` adds pipefail so a failing
    # suite fails the job here too — see the note in ci.yml's `test` job.
    defaults:
      run:
        shell: bash
    steps:
      # Pinned by SHA; ci.yml's `test` job says why.
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7

      # The crates to measure are crates/layers.toml's badged crates, less any
      # it marks `coverage = false`. Read once, here, for every step below;
      # the assignment fails the step when crate_list.py refuses.
      - name: List the crates to measure
        run: |
          crates=$(python3 scripts/crate_list.py list coverage)
          echo "CRATES=${crates//$'\n'/ }" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup show

      # No build cache, on purpose. `target` here holds cargo-llvm-cov's
      # instrumented build, which cached whole takes most of the repository's
      # Actions cache limit and is nearly always evicted before the next run
      # can restore it. Only the coverage badges wait on this job, so the
      # space goes to the entries pull-request CI restores.
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y bc libasound2-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Build Web UI
        run: |
          npm ci
          npm run build

      - name: Run Rust tests with coverage
        run: |
          cargo llvm-cov $(printf -- '-p %s ' $CRATES) \
            --lcov --output-path lcov.info 2>&1 | tee rust-test-output.txt

      - name: Run per-crate Rust coverage
        run: |
          # Use `cargo llvm-cov report` (report-only subcommand) to slice per-package
          # lcov files from the profdata already collected in the combined step above.
          # This does NOT recompile or relink anything — it just re-processes the
          # existing profdata + instrumented binaries.
          #
          # NOTE: `report` does NOT accept --all-features (it's a report-only
          # subcommand that doesn't invoke cargo build).
          for crate in $CRATES; do
            cargo llvm-cov report --package "$crate" --lcov --output-path "$crate-lcov.info"
          done

      - name: Generate HTML report
        run: |
          cargo llvm-cov report $(printf -- '--package %s ' $CRATES) --html

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            target/llvm-cov/html/
            lcov.info
            *-lcov.info
            rust-test-output.txt
          retention-days: 30
