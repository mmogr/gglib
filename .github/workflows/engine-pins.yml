name: Engine pins

# Once a week, propose moving each engine's pin to upstream's newest release
# that is at least three days old, as a pull request for a person to check
# and merge (CONTRIBUTING.md, "The engine pins"). The job picks the tag,
# edits the pin's one line, builds gglib, installs the candidate and records
# what it answers into contracts/upstream/ (on a llama.cpp bump, with tier 3's
# real small model too, and the in-process engine built at the candidate on
# macOS into llama-inproc/), and opens the pull request with both in one
# commit. Its body, from scripts/engine_pin_body.sh, leads with the ADR
# readings that moved. CI's CLI Check then checks every launch flag gglib
# passes against the release, `ADR criterion moved` holds the readings to
# their approvals, and Test (Rust) holds llama-inproc/ to llama/.
#
# It never edits or force-pushes a branch, and proposes a candidate once: a
# pull request from the candidate's branch, open or closed, means it has been
# proposed. It proposes one at a time: while a pin pull request for an engine
# is open, nothing newer is proposed for it, so they never pile up. It writes
# to no issue.
#
# llama.cpp's candidate is the `b<n>` its newest `v*` release names in
# `nightly-tag.txt`; stable-diffusion.cpp's is its newest `master-<n>-<sha>`
# release by `n`. Both are taken only once three days old.

on:
  schedule:
    # 03:23 on Monday in Brisbane (17:23 UTC on Sunday), so the pull request
    # is waiting at the start of the week. Cron here is always UTC.
    - cron: '23 17 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: engine-pins
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# Three jobs, so the write token is never on a machine that has run untrusted
# code. `record` picks the candidate, builds gglib, installs the candidate and
# runs it and tier 3's model; it has no secret and reads only. It hands over
# the pin file, contracts/upstream/ and the recorder's outcome as an artifact.
# On a llama.cpp bump `record-inproc`, on macOS and as read-only, takes that
# handover, records the in-process engine at the candidate beside it, and
# hands both over. `propose`, on a fresh runner, takes the last handover as
# data (scripts/engine_pin_take.sh), writes the body from its own checkout,
# and only then mints the app token to push and open the pull request.

jobs:
  record:
    name: Record a new ${{ matrix.product }} pin
    runs-on: ubuntu-24.04
    # A mostly cold build (below), the 20-minute recorder and tier 3's
    # 30 minutes fit inside this.
    timeout-minutes: 120
    # Reads only: the pick step's release and pull request lookups, and the
    # engine installer's release listings.
    permissions:
      contents: read
      pull-requests: read
    # `true` when the llama.cpp leg proposes a candidate, which `record-inproc`
    # waits for. The sd leg's is empty, and an empty output never replaces
    # another leg's.
    outputs:
      llama_proposes: ${{ matrix.engine == 'llama' && steps.pick.outputs.propose || '' }}
    # As ci.yml sets it. rust-cache hashes the CARGO* and RUST* variables into
    # its key, so an environment that differs restores nothing of `test`'s.
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: llama
            product: llama.cpp
            repo: ggml-org/llama.cpp
            file: crates/gglib-core/src/domain/engine_pins.rs
            constant: PINNED_LLAMA_RELEASE
          - engine: sd
            product: stable-diffusion.cpp
            repo: leejet/stable-diffusion.cpp
            file: crates/gglib-runtime/src/sd/install/release.rs
            constant: PINNED_SD_RELEASE
    steps:
      # This job has no write token; no credential stays on disk either.
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false

      - name: Pick the candidate
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ matrix.engine }}
          REPO: ${{ matrix.repo }}
          FILE: ${{ matrix.file }}
          CONSTANT: ${{ matrix.constant }}
        run: |
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          current=$(sed -nE "s/.*$CONSTANT: &str = \"([^\"]+)\".*/\1/p" "$FILE")
          [[ -n $current ]] || { echo "::error::$CONSTANT is not in $FILE"; exit 1; }

          candidate=""
          if [[ $ENGINE == llama ]]; then
            # The newest v* release from before the cutoff, not a prerelease,
            # and the b<n> it names. A v* tag with no release is passed over;
            # any other failure to read one stops the step.
            for tag in $(git ls-remote --tags "https://github.com/$REPO" 'refs/tags/v*' \
                | sed -nE 's|.*refs/tags/(v[0-9.]+)$|\1|p' | sort -rV); do
              if ! release=$(gh release view "$tag" -R "$REPO" --json publishedAt,isPrerelease \
                  -q '"\(.isPrerelease) \(.publishedAt)"' 2> "$RUNNER_TEMP/release.err"); then
                grep -qx 'release not found' "$RUNNER_TEMP/release.err" && continue
                cat "$RUNNER_TEMP/release.err"
                exit 1
              fi
              [[ $release == "false "* ]] || continue
              published=${release#false }
              [[ -n $published && $published < $cutoff ]] || continue
              gh release download "$tag" -R "$REPO" -p nightly-tag.txt \
                -O "$RUNNER_TEMP/nightly-tag.txt" --clobber
              candidate=$(tr -d '[:space:]' < "$RUNNER_TEMP/nightly-tag.txt")
              break
            done
            pattern='^b([0-9]+)$'
          else
            # The newest master-<n>-<sha> release from before the cutoff, by n.
            candidate=$(gh release list -R "$REPO" --limit 100 --exclude-pre-releases \
              --json tagName,publishedAt \
              -q "[.[] | select(.publishedAt < \"$cutoff\")
                       | select(.tagName | test(\"^master-[0-9]+-[0-9a-f]+$\"))]
                  | max_by(.tagName | split(\"-\")[1] | tonumber) | .tagName // empty")
            pattern='^master-([0-9]+)-[0-9a-f]+$'
          fi
          [[ $current =~ $pattern ]] || { echo "::error::the pin $current is not a numbered release"; exit 1; }
          current_n=${BASH_REMATCH[1]}
          [[ -n $candidate && $candidate =~ $pattern ]] \
            || { echo "::error::no numbered candidate found (got '$candidate')"; exit 1; }
          candidate_n=${BASH_REMATCH[1]}

          branch="chore(deps)/$ENGINE-$candidate"
          # An assignment, so a failed lookup stops the step rather than
          # reading as a pull request that exists.
          proposed=$(gh pr list -R "$GITHUB_REPOSITORY" --state all --head "$branch" --json number -q length)
          waiting=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName \
            -q "[.[] | select(.headRefName | startswith(\"chore(deps)/$ENGINE-\"))] | .[0].headRefName // empty")
          if [[ $proposed == 0 ]] && git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            echo "::error::$branch exists with no pull request, from a run that stopped before opening one. Delete the branch, or open its pull request by hand."
            exit 1
          fi
          {
            echo "current=$current"
            echo "candidate=$candidate"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          if (( candidate_n <= current_n )); then
            echo "$CONSTANT is $current; upstream's newest release three days old is $candidate. Nothing to propose." >> "$GITHUB_STEP_SUMMARY"
            echo "propose=false" >> "$GITHUB_OUTPUT"
          elif [[ $proposed != 0 ]]; then
            echo "$candidate was proposed already, from $branch." >> "$GITHUB_STEP_SUMMARY"
            echo "propose=false" >> "$GITHUB_OUTPUT"
          elif [[ -n $waiting ]]; then
            echo "$waiting is still open; nothing newer is proposed until it is merged or closed." >> "$GITHUB_STEP_SUMMARY"
            echo "propose=false" >> "$GITHUB_OUTPUT"
          else
            echo "propose=true" >> "$GITHUB_OUTPUT"
          fi

      # Before the build: gglib installs the pin it was built with, and the
      # engines action reads the pin from this file.
      - name: Move the pin
        if: steps.pick.outputs.propose == 'true'
        env:
          FILE: ${{ matrix.file }}
          CONSTANT: ${{ matrix.constant }}
          CURRENT: ${{ steps.pick.outputs.current }}
          CANDIDATE: ${{ steps.pick.outputs.candidate }}
        run: |
          sed -i -E "s/($CONSTANT: &str = )\"$CURRENT\"/\1\"$CANDIDATE\"/" "$FILE"
          changed=$(git diff --numstat | awk '{ n += $1 + $2 } END { print n + 0 }')
          [[ $changed == 2 && $(git diff --name-only) == "$FILE" ]] \
            || { git diff; echo "::error::moving the pin should change one line of $FILE"; exit 1; }

      # The rest records what the candidate answers, as ci.yml's CLI Check
      # does on Linux, so the pull request carries its recordings. The build
      # restores the `test` job's cache, which only main saves, but that job
      # builds the whole workspace and `-p` here unifies features differently,
      # so most of the graph still builds cold.
      - name: Free disk space
        if: steps.pick.outputs.propose == 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Install system dependencies
        if: steps.pick.outputs.propose == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        if: steps.pick.outputs.propose == 'true'
        run: rustup show

      - name: Restore the test job's Rust cache
        if: steps.pick.outputs.propose == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-test"
          save-if: false

      - name: Build gglib and the recorder
        if: steps.pick.outputs.propose == 'true'
        run: |
          cargo build --locked -p gglib-cli --bin gglib
          cargo test --locked -p gglib-runtime --lib --no-run

      # A candidate that does not install still gets its pull request, which
      # says so, and is red there too.
      - name: Install the candidate engines and the test models
        if: steps.pick.outputs.propose == 'true'
        id: engines
        continue-on-error: true
        uses: ./.github/actions/pinned-engines
        with:
          target: x86_64-unknown-linux-gnu

      # A recorder that fails still opens the pull request, which says so.
      - name: Record the candidate
        if: steps.pick.outputs.propose == 'true' && steps.engines.outcome == 'success'
        id: record
        continue-on-error: true
        timeout-minutes: 20
        env:
          GGLIB_ENGINES_DIR: ${{ steps.engines.outputs.engines }}
          GGLIB_ENGINE_MODELS_DIR: ${{ steps.engines.outputs.models }}
          GGLIB_ENGINE_BODIES_DIR: ${{ github.workspace }}/contracts/upstream/llama/bodies
          GGLIB_RECORD_CONTRACTS: "1"
        run: |
          cargo test --locked -p gglib-runtime --lib -- --ignored --nocapture --exact \
            engine_contract_tests::the_pinned_llama_server_answers_as_contracts_upstream_records \
            2>&1 | tee "$RUNNER_TEMP/record.log"

      # Tier 3, on a llama.cpp bump only: a real small model, uncached, and
      # four booleans into contracts/upstream/llama/tier3/, which no check
      # reads. Nothing here fails the job; a probe that cannot run says why,
      # a candidate that did not install included.
      - name: Probe a real small model
        if: steps.pick.outputs.propose == 'true' && matrix.engine == 'llama'
        continue-on-error: true
        timeout-minutes: 30
        env:
          INSTALLED: ${{ steps.engines.outcome }}
          LIST: .github/actions/pinned-engines/tier3-models.txt
          MODELS: ${{ steps.engines.outputs.models }}
          GGLIB_ENGINES_DIR: ${{ steps.engines.outputs.engines }}
          GGLIB_TIER3_MODEL_DIR: ${{ runner.temp }}/tier3-models
          GGLIB_ENGINE_BODIES_DIR: ${{ runner.temp }}/engine-pin/bodies
        run: |
          out=contracts/upstream/llama/tier3/readings.json
          unread() {
            mkdir -p "${out%/*}"
            jq -n --arg why "$1" '{value: null, reason: $why} as $p
              | {model: "Qwen3.5-0.8B-Q8_0.gguf", projector: "mmproj-F16.gguf",
                 tool_call_native: $p, tool_call_parsed: $p, reasoning_split: $p,
                 image_in_tool_message_answered: $p}' > "$out"
          }
          if [[ $INSTALLED != success ]]; then
            unread "the candidate did not install"
            exit 0
          fi
          # The test replaces it; it is what is left if the step stops part-way.
          unread "the probe step did not finish"
          mkdir -p "$GGLIB_TIER3_MODEL_DIR"
          if ! grep -v '^#' "$LIST" | while read -r name sum url; do
                [[ -z $name ]] && continue
                curl -fsSL --retry 3 --max-time 600 -o "$GGLIB_TIER3_MODEL_DIR/$name" "$url" \
                  && echo "$sum  $GGLIB_TIER3_MODEL_DIR/$name" | sha256sum -c --quiet - \
                  || exit 1
              done; then
            unread "the model download failed"
            exit 0
          fi
          cp "$MODELS/0_cat.png" "$GGLIB_TIER3_MODEL_DIR/"
          if ! timeout 20m cargo test --locked -p gglib-runtime --lib -- --ignored --nocapture --exact \
              engine_contract_tests::tier3::a_small_real_model_through_the_pinned_llama_server; then
            unread "the probe test did not finish"
          fi

      # The model's answers, the recordings and the recorder's log, for
      # whoever reads the pull request.
      - name: Gather what was recorded
        if: always() && steps.pick.outputs.propose == 'true'
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/engine-pin"
          mkdir -p "$out"
          cp -R contracts/upstream "$out/upstream"
          if [[ -f $RUNNER_TEMP/record.log ]]; then cp "$RUNNER_TEMP/record.log" "$out/"; fi

      - name: Upload what was recorded
        if: always() && steps.pick.outputs.propose == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: engine-pin-${{ matrix.engine }}-${{ steps.pick.outputs.candidate }}
          path: ${{ runner.temp }}/engine-pin
          if-no-files-found: ignore

      # What `propose` takes: the pin file and contracts/upstream/ at their
      # paths, and one line for the recorder, `ok` or why it did not run.
      - name: Hand over the pin and its recordings
        if: steps.pick.outputs.propose == 'true'
        env:
          FILE: ${{ matrix.file }}
          INSTALLED: ${{ steps.engines.outcome }}
          RECORDED: ${{ steps.record.outcome }}
        run: |
          out="$RUNNER_TEMP/handover"
          mkdir -p "$out/files/${FILE%/*}"
          cp "$FILE" "$out/files/$FILE"
          mkdir -p "$out/files/contracts"
          cp -R contracts/upstream "$out/files/contracts/"
          if [[ $INSTALLED != success ]]; then
            recorder="the candidate did not install"
          elif [[ $RECORDED == success ]]; then
            recorder=ok
          else
            log="$RUNNER_TEMP/record.log"
            recorder=$(awk '/panicked at/ { getline; print; exit }' "$log" 2>/dev/null || true)
            [[ -n $recorder ]] || recorder=$(grep -m1 '^error' "$log" 2>/dev/null || true)
            [[ -n $recorder ]] || recorder="the record step ended in $RECORDED"
          fi
          printf '%s\n' "${recorder:0:200}" > "$out/recorder.txt"

      - name: Upload the handover
        if: steps.pick.outputs.propose == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: engine-pin-handover-${{ matrix.engine }}
          path: ${{ runner.temp }}/handover
          retention-days: 1

  # The in-process engine at the candidate, on a llama.cpp bump: a phone's
  # engine, gglib-engine-llama over llama.cpp's own llama.xcframework, asked
  # the recorder's questions into contracts/upstream/llama-inproc. It runs on
  # macOS, where the framework builds, once `record` has moved the pin and
  # recorded llama-server: it takes that handover as `propose` does, so the
  # in-process recording's parity readings are against llama-server at the
  # candidate, and hands over both recordings, with `record`'s line and one
  # of its own. `propose` takes this handover in place of `record`'s. A
  # framework or a recorder that fails still hands over, saying so; a
  # function the shim calls that the candidate renamed or retyped then fails
  # CI's `phone-llama` on the pull request. It starts only when the llama.cpp
  # leg proposes, so a run with nothing to propose, or an sd-only one, starts
  # no macOS runner. `propose` waits for it, so on a run that bumps both
  # engines the sd pull request opens after it too.
  record-inproc:
    name: Record the in-process engine at a new llama.cpp pin
    needs: record
    if: ${{ !cancelled() && needs.record.outputs.llama_proposes == 'true' }}
    runs-on: macos-26
    # A cold llama.xcframework (20 to 30 minutes), a cold build of the
    # recorder, and the recorder itself.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false

      # A llama.cpp leg that stopped before its handover leaves none, and
      # every step below is skipped.
      - name: Download the llama.cpp handover
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: engine-pin-handover-llama
          path: ${{ runner.temp }}/handover

      # As `propose` takes it: the pin moved by its one line to a b<n> tag,
      # and contracts/upstream/ as llama-server answered at the candidate.
      - name: Take the pin and llama-server's recordings
        if: steps.download.outcome == 'success'
        id: take
        env:
          FILE: crates/gglib-core/src/domain/engine_pins.rs
        run: |
          current=$(scripts/llama_pin.sh)
          recorder=$(scripts/engine_pin_take.sh "$RUNNER_TEMP/handover" "$FILE")
          candidate=$(scripts/llama_pin.sh)
          [[ $candidate =~ ^b[0-9]+$ && $candidate != "$current" ]] \
            || { echo "::error::the handover's pin is not a new llama.cpp release"; exit 1; }
          [[ $(git diff --numstat -- "$FILE") == $'1\t1\t'"$FILE" ]] \
            || { git diff -- "$FILE"; echo "::error::moving the pin should change one line of $FILE"; exit 1; }
          printf '%s\n' "$recorder" > "$RUNNER_TEMP/recorder.txt"
          echo "pin=$candidate" >> "$GITHUB_OUTPUT"

      # The recorder's models, and the candidate's chat templates, which
      # move with the pin: the pinned-engines action without its engines,
      # before anything built at the candidate runs.
      - name: Fetch the test models and the candidate's chat templates
        if: steps.take.outcome == 'success'
        id: models
        uses: ./.github/actions/pinned-engines
        with:
          target: aarch64-apple-darwin
          engines: "false"

      - name: Build llama.xcframework at the candidate
        if: steps.take.outcome == 'success'
        id: xcframework
        continue-on-error: true
        uses: ./.github/actions/llama-xcframework

      # rust-toolchain.toml lists the Apple targets, so this installs them.
      - name: Install Rust toolchain
        if: steps.take.outcome == 'success'
        run: rustup show

      - name: Record the in-process engine at the candidate
        if: steps.xcframework.outcome == 'success'
        id: record
        continue-on-error: true
        timeout-minutes: 45
        env:
          GGLIB_ENGINE_MODELS_DIR: ${{ steps.models.outputs.models }}
          GGLIB_INPROC_ENGINE: "1"
          GGLIB_RECORD_CONTRACTS: "1"
        run: |
          cargo test --locked -p gglib-runtime --lib --features inproc-contract -- --ignored --nocapture --exact \
            engine_contract_tests::the_in_process_engine_answers_as_contracts_upstream_records \
            2>&1 | tee "$RUNNER_TEMP/record-inproc.log"

      # What `propose` takes in place of `record`'s handover: the pin file and
      # contracts/upstream/, llama-server's recordings as taken with
      # llama-inproc/ beside them, `record`'s line, and this job's own: `ok`,
      # or why the in-process engine was not recorded.
      - name: Hand over both recordings
        if: steps.take.outcome == 'success'
        env:
          FILE: crates/gglib-core/src/domain/engine_pins.rs
          BUILT: ${{ steps.xcframework.outcome }}
          RECORDED: ${{ steps.record.outcome }}
        run: |
          out="$RUNNER_TEMP/handover-inproc"
          mkdir -p "$out/files/${FILE%/*}" "$out/files/contracts"
          cp "$FILE" "$out/files/$FILE"
          cp -R contracts/upstream "$out/files/contracts/"
          cp "$RUNNER_TEMP/recorder.txt" "$out/recorder.txt"
          if [[ $BUILT != success ]]; then
            recorder="llama.xcframework did not build at the candidate"
          elif [[ $RECORDED == success ]]; then
            recorder=ok
          else
            log="$RUNNER_TEMP/record-inproc.log"
            recorder=$(awk '/panicked at/ { getline; print; exit }' "$log" 2>/dev/null || true)
            [[ -n $recorder ]] || recorder=$(grep -m1 '^error' "$log" 2>/dev/null || true)
            [[ -n $recorder ]] || recorder="the in-process record step ended in $RECORDED"
          fi
          printf '%s\n' "${recorder:0:200}" > "$out/recorder-inproc.txt"

      - name: Upload the handover
        if: steps.take.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: engine-pin-handover-llama-inproc
          path: ${{ runner.temp }}/handover-inproc
          retention-days: 1

      # The in-process recording and the recorder's log, for whoever reads
      # the pull request.
      - name: Upload what was recorded
        if: always() && steps.take.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: engine-pin-llama-inproc-${{ steps.take.outputs.pin }}
          path: |
            contracts/upstream/llama-inproc
            ${{ runner.temp }}/record-inproc.log
          if-no-files-found: ignore

  propose:
    name: Propose a new ${{ matrix.product }} pin
    needs: [record, record-inproc]
    # After each leg of `record` and `record-inproc`, whatever they
    # concluded: a leg with nothing to propose, or that stopped before its
    # handover, leaves no artifact, and this leg then ends without proposing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: llama
            product: llama.cpp
            repo: ggml-org/llama.cpp
            file: crates/gglib-core/src/domain/engine_pins.rs
            constant: PINNED_LLAMA_RELEASE
            tag: '^b[0-9]+$'
          - engine: sd
            product: stable-diffusion.cpp
            repo: leejet/stable-diffusion.cpp
            file: crates/gglib-runtime/src/sd/install/release.rs
            constant: PINNED_SD_RELEASE
            tag: '^master-[0-9]+-[0-9a-f]+$'
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          persist-credentials: false

      - name: Download the handover
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: engine-pin-handover-${{ matrix.engine }}
          path: ${{ runner.temp }}/handover

      # On a llama.cpp bump `record-inproc` hands over `record`'s recordings
      # as it took them, with the in-process engine's beside them: taken in
      # place of `record`'s when it is there.
      - name: Download the in-process handover
        if: matrix.engine == 'llama' && steps.download.outcome == 'success'
        id: download-inproc
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: engine-pin-handover-llama-inproc
          path: ${{ runner.temp }}/handover-inproc

      # The handover is data from a machine that ran untrusted code: only
      # regular files at the pin's path and under contracts/upstream/ are
      # taken, approvals.json stays as main has it, and the pin may move by
      # its one line to a tag of the engine's own form.
      - name: Take the pin and its recordings
        if: steps.download.outcome == 'success'
        id: take
        env:
          FILE: ${{ matrix.file }}
          CONSTANT: ${{ matrix.constant }}
          TAG: ${{ matrix.tag }}
          ENGINE: ${{ matrix.engine }}
          INPROC: ${{ steps.download-inproc.outcome }}
        run: |
          current=$(sed -nE "s/.*$CONSTANT: &str = \"([^\"]+)\".*/\1/p" "$FILE")
          cp -R contracts/upstream "$RUNNER_TEMP/upstream-before"
          handover="$RUNNER_TEMP/handover"
          inproc="the in-process recording left no handover"
          if [[ $INPROC == success ]]; then
            handover="$RUNNER_TEMP/handover-inproc"
            inproc=$(head -1 "$handover/recorder-inproc.txt" 2>/dev/null | tr -cd '[:print:]' | tr -d '`' | cut -c1-200 || true)
          fi
          recorder=$(scripts/engine_pin_take.sh "$handover" "$FILE")
          candidate=$(sed -nE "s/.*$CONSTANT: &str = \"([^\"]+)\".*/\1/p" "$FILE")
          [[ $candidate =~ $TAG && $candidate != "$current" ]] \
            || { echo "::error::the handover's pin is not a new $ENGINE release"; exit 1; }
          git add -- "$FILE" contracts/upstream
          stray=$(git status --porcelain --untracked-files=all --no-renames | cut -c4- \
            | grep -vxF "$FILE" | grep -v '^contracts/upstream/' || true)
          [[ -z $stray ]] \
            || { echo "::error::a pin pull request changes the pin's line and contracts/upstream/ only, not: $stray"; exit 1; }
          [[ $(git diff --cached --numstat -- "$FILE") == $'1\t1\t'"$FILE" ]] \
            || { git diff --cached -- "$FILE"; echo "::error::moving the pin should change one line of $FILE"; exit 1; }
          {
            echo "current=$current"
            echo "candidate=$candidate"
            echo "branch=chore(deps)/$ENGINE-$candidate"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "$recorder" > "$RUNNER_TEMP/recorder.txt"
          if [[ $ENGINE == llama ]]; then
            printf '%s\n' "${inproc:-the in-process recorder left no reason}" > "$RUNNER_TEMP/recorder-inproc.txt"
          fi

      - name: Write the body
        if: steps.take.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ matrix.engine }}
          FILE: ${{ matrix.file }}
          CURRENT: ${{ steps.take.outputs.current }}
          CANDIDATE: ${{ steps.take.outputs.candidate }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          recorder=$(cat "$RUNNER_TEMP/recorder.txt")
          inproc=()
          if [[ -f $RUNNER_TEMP/recorder-inproc.txt ]]; then inproc=("$(cat "$RUNNER_TEMP/recorder-inproc.txt")"); fi
          if ! scripts/engine_pin_body.sh "$ENGINE" "$CURRENT" "$CANDIDATE" \
              "$RUNNER_TEMP/upstream-before" contracts/upstream "$recorder" "$RUN_URL" "${inproc[@]}" > "$RUNNER_TEMP/body.md"; then
            printf 'Moves %s from %s to %s. The body could not be written; read the run: %s\n' \
              "$FILE" "$CURRENT" "$CANDIDATE" "$RUN_URL" > "$RUNNER_TEMP/body.md"
          fi

      # Minted last, on a runner that has run nothing from the handover or
      # upstream: no build, engine or model is ever in reach of it.
      - name: Generate GitHub App token
        if: steps.take.outcome == 'success'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit the pin and its recordings, and open a pull request
        if: steps.take.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRODUCT: ${{ matrix.product }}
          CURRENT: ${{ steps.take.outputs.current }}
          CANDIDATE: ${{ steps.take.outputs.candidate }}
          BRANCH: ${{ steps.take.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          subject="chore(deps): move $PRODUCT's pin from $CURRENT to $CANDIDATE"
          git switch -c "$BRANCH"
          git -c user.name=mmogr -c user.email=172192206+mmogr@users.noreply.github.com \
            commit -m "$subject"
          # The token goes to this one push through the environment, never
          # into the checkout's config or a command line.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" \
            git push origin "$BRANCH"
          url=$(gh pr create --base "$BASE" --head "$BRANCH" --title "$subject" \
            --body-file "$RUNNER_TEMP/body.md" \
            --label dependencies --label "type: chore" --label automated)
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
