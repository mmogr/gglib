name: Update Badges

on:
  workflow_run:
    workflows: ["CI", "Coverage"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

# One group for everything that pushes to the badges branch: this workflow
# for both of its triggers, and status-card.yml. A second push queues behind
# the first instead of racing it.
concurrency:
  group: badges-branch
  cancel-in-progress: false

defaults:
  run:
    # GitHub's default is `bash -e`; this adds pipefail.
    shell: bash

jobs:
  badges:
    name: Update Badges
    # Only a green run of a push to main. A red or cancelled run leaves the
    # badges as they were; the CI badge at the top of the README is the one
    # that turns red.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The commit the run tested, not main's tip: scc counts its crates and
      # Cargo.toml gives its version, and crates/layers.toml says which files
      # the branch should hold.
      - name: Checkout the commit the run tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout the badges branch
        uses: actions/checkout@v7
        with:
          ref: badges
          path: badges
          fetch-depth: 1

      - name: Download the run's artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          case "$WORKFLOW" in
            CI) event=ci; artifact=test-results ;;
            Coverage) event=coverage; artifact=coverage-report ;;
            *) echo "::error::badges.yml reads CI and Coverage runs, not $WORKFLOW"; exit 1 ;;
          esac
          echo "EVENT=$event" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" --name "$artifact" --dir artifacts

      # The release tarball, checked against the checksum its release
      # lists, so a moved asset cannot change what counts the lines.
      - name: Install scc
        if: env.EVENT == 'ci'
        env:
          URL: https://github.com/boyter/scc/releases/download/v3.2.0/scc_Linux_x86_64.tar.gz
          SHA256: 975446e993cdd0a0193084ba43b13d290a48d4510c9210d788046b9a10acf609
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/scc.tar.gz" "$URL"
          echo "$SHA256  $RUNNER_TEMP/scc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/scc.tar.gz" -C "$RUNNER_TEMP" scc
          sudo install "$RUNNER_TEMP/scc" /usr/local/bin/scc

      # What each run writes, keeps and deletes is in the script's header.
      - name: Write the badges
        run: python3 scripts/write_badges.py write --event "$EVENT" --artifacts artifacts --branch badges

      # The action clones the branch itself and copies this directory in;
      # the checkout's own .git has no business in the copy.
      - name: Drop the checkout's git directory
        run: rm -rf badges/.git

      # `keep_files: false`: the branch becomes exactly this directory, so a
      # file the script deleted is deleted on the branch too. And
      # `force_orphan`: it becomes one commit with no parent, so the branch
      # stays one commit long however often it is published. Safe here
      # because the directory is a checkout of the whole branch, the status
      # card's two SVGs included; status-card.yml publishes only its two
      # files and must never set it.
      - name: Deploy to badges branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          publish_branch: badges
          keep_files: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update badges [skip ci] ${{ github.event.workflow_run.head_sha }}'
