name: Pinned engines
description: >-
  Installs the pinned llama.cpp and stable-diffusion.cpp with the gglib just
  built (target/debug/gglib), as a user's machine would, and fetches the
  recorder's tiny models and the pin's chat templates. Shared by ci.yml's
  CLI Check legs and the engine-pins workflow, whose in-process recording
  takes only the models and templates.

inputs:
  target:
    description: The Rust target triple, which keys the engine cache.
    required: true
  engines:
    description: >-
      "false" fetches the models and the pin's chat templates and installs
      no engine, so no gglib build is needed.
    required: false
    default: "true"

outputs:
  llama:
    description: PINNED_LLAMA_RELEASE.
    value: ${{ steps.pins.outputs.llama }}
  sd:
    description: PINNED_SD_RELEASE.
    value: ${{ steps.pins.outputs.sd }}
  engines:
    description: The folder the engines are installed into (GGLIB_ENGINES_DIR).
    value: ${{ steps.pins.outputs.engines }}
  models:
    description: The models and templates/ (GGLIB_ENGINE_MODELS_DIR).
    value: ${{ steps.pins.outputs.models }}

runs:
  using: composite
  steps:
    - name: Read the engine pins
      id: pins
      shell: bash
      run: |
        llama=$(scripts/llama_pin.sh)
        sd=$(sed -nE 's/.*PINNED_SD_RELEASE: &str = "([^"]+)".*/\1/p' crates/gglib-runtime/src/sd/install/release.rs)
        [[ -n $llama && -n $sd ]] || exit 1
        {
          echo "llama=$llama"
          echo "sd=$sd"
          echo "engines=$RUNNER_TEMP/engines"
          echo "models=$RUNNER_TEMP/test-models"
        } >> "$GITHUB_OUTPUT"

    # The models are the same on every platform and for every pin, so they
    # have an entry of their own, keyed by the list. They are fetched and
    # saved before any engine is installed or run, so nothing a candidate
    # engine does can reach the entry a later run restores.
    - name: Restore the test models
      id: models-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pins.outputs.models }}
        key: test-models-${{ hashFiles('.github/actions/pinned-engines/models.txt') }}

    # The templates are fetched at the pin on every run: they move with it.
    - name: Fetch the test models and the pin's chat templates
      shell: bash
      env:
        MODELS: ${{ steps.pins.outputs.models }}
        LIST: ${{ github.action_path }}/models.txt
        PIN: ${{ steps.pins.outputs.llama }}
      run: |
        mkdir -p "$MODELS/templates"
        grep -v '^#' "$LIST" | while read -r name url; do
          [[ -z $name || -s $MODELS/$name ]] && continue
          curl -fsSL --retry 3 -o "$MODELS/$name.part" "$url"
          mv "$MODELS/$name.part" "$MODELS/$name"
        done
        for template in Qwen3.5-4B Qwen-Qwen3-0.6B ibm-granite-granite-4.0; do
          curl -fsSL --retry 3 -o "$MODELS/templates/$template.jinja" \
            "https://raw.githubusercontent.com/ggml-org/llama.cpp/$PIN/models/templates/$template.jinja"
        done

    - name: Save the test models
      if: steps.models-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.pins.outputs.models }}
        key: ${{ steps.models-cache.outputs.cache-primary-key }}

    # The installs are cached by the two pins, so later runs skip the
    # downloads. The entry is saved as soon as both installs pass, never after
    # one fails: the Engine pins workflow continues past a failed install.
    - name: Restore the pinned engines
      if: inputs.engines == 'true'
      id: engines-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.pins.outputs.engines }}
        key: pinned-engines-${{ inputs.target }}-${{ steps.pins.outputs.llama }}-${{ steps.pins.outputs.sd }}

    - name: Install the pinned engines
      if: inputs.engines == 'true'
      shell: bash
      env:
        GGLIB_DATA_DIR: ${{ steps.pins.outputs.engines }}
        GGLIB_RESOURCE_DIR: ${{ steps.pins.outputs.engines }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        target/debug/gglib config llama install
        target/debug/gglib config sd install

    - name: Save the pinned engines
      if: inputs.engines == 'true' && steps.engines-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.pins.outputs.engines }}
        key: ${{ steps.engines-cache.outputs.cache-primary-key }}
