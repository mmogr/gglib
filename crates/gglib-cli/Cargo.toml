[package]
name = "gglib-cli"
version.workspace = true
edition.workspace = true
description = "CLI interface for gglib"
license.workspace = true
publish = false

[[bin]]
name = "gglib"
path = "src/main.rs"

[dependencies]
gglib-app-services = { workspace = true }
gglib-axum = { workspace = true }
gglib-bootstrap = { workspace = true }
gglib-build-info.workspace = true
gglib-core = { workspace = true }
gglib-db = { workspace = true }
gglib-download = { workspace = true }
gglib-mcp = { workspace = true }
gglib-proxy = { workspace = true }
gglib-runtime = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls", "system-proxy"] }

# CLI-specific dependencies
clap = { version = "4.0", features = ["derive", "env"] }
clap_complete = "4"
indicatif = { workspace = true }
termimad = { workspace = true }
crossterm = { workspace = true }
# `console` is the input-side companion to indicatif (same authors). Used by the
# interactive download monitor for single-keystroke reads (`Term::read_key`) and
# cooked-mode line input (`Term::read_line`). Importing directly (rather than
# relying on indicatif's transitive dep) makes the dependency explicit.
console = "0.16"
chrono = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
anyhow = { workspace = true }
# `ModelRuntimePort` is an async trait, and the view of what is being served
# under this data root implements it (`handlers/model/recorded_servers.rs`).
async-trait = { workspace = true }
dotenvy = { workspace = true }
rustyline = "14"
serde = { workspace = true }
tracing = { workspace = true }
# Streams the SSE body for `gglib proxy dashboard` (crossterm-based redraw,
# no ratatui — see handlers/proxy_dashboard.rs module docs).
futures-util = { workspace = true }
# Pure-Rust mDNS/DNS-SD responder for `gglib web --share-lan`; no system daemon
# dependency. Deliberately scoped to this crate — LAN advertising is a CLI
# concern and must not reach the shared axum/app-services/Tauri layers.
mdns-sd = "0.20"
# Draws the pairing QR for `gglib remote enable`. No default features: the
# `image` renderer would pull an image stack in for a code drawn as Unicode
# half-blocks; the `unicode` renderer needs nothing.
qrcode = { version = "0.14", default-features = false }
# Hands the `gglib web` link to the system's launcher (open, xdg-open, start).
open.workspace = true

[dev-dependencies]
gglib-db = { workspace = true, features = ["test-utils"] }
# A data root of the test binary's own, for a test that names the daemon's
# token file (#955).
gglib-core = { workspace = true, features = ["test-utils"] }
# The GGUF files a test library holds.
gglib-gguf = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }

[lints]
workspace = true
