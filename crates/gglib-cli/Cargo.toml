[package]
name = "gglib-cli"
version.workspace = true
edition.workspace = true
description = "CLI interface for gglib"
license.workspace = true
publish = false

[[bin]]
name = "gglib"
path = "src/main.rs"

[dependencies]
gglib-app-services = { path = "../gglib-app-services" }
gglib-axum = { path = "../gglib-axum" }
gglib-bootstrap = { path = "../gglib-bootstrap" }
gglib-build-info = { path = "../gglib-build-info" }
gglib-core = { path = "../gglib-core" }
gglib-db = { path = "../gglib-db" }
gglib-download = { path = "../gglib-download" }
gglib-hf = { path = "../gglib-hf" }
gglib-mcp = { path = "../gglib-mcp" }
gglib-proxy = { path = "../gglib-proxy" }
gglib-runtime = { path = "../gglib-runtime", features = ["cli"] }
reqwest = { workspace = true }

# CLI-specific dependencies
clap = { version = "4.0", features = ["derive", "env"] }
clap_complete = "4"
indicatif = { workspace = true }
termimad = { workspace = true }
crossterm = { workspace = true }
# `console` is the input-side companion to indicatif (same authors). Used by the
# interactive download monitor for single-keystroke reads (`Term::read_key`) and
# cooked-mode line input (`Term::read_line`). Importing directly (rather than
# relying on indicatif's transitive dep) makes the dependency explicit.
console = "0.16"
chrono = { workspace = true }
serde_json = { workspace = true }
hf-hub = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
anyhow = { workspace = true }
dotenvy = "0.15"
rustyline = "14"
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Streams the SSE body for `gglib proxy dashboard` (crossterm-based redraw,
# no ratatui — see handlers/proxy_dashboard.rs module docs).
futures-util = { workspace = true }
# Pure-Rust mDNS/DNS-SD responder for `gglib web --share-lan`; no system daemon
# dependency. Deliberately scoped to this crate — LAN advertising is a CLI
# concern and must not reach the shared axum/app-services/Tauri layers.
mdns-sd = "0.20"

[dev-dependencies]
async-trait = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }

[lints.rustdoc]
# Mirrors `[workspace.lints.rustdoc]`, which this crate cannot inherit while it
# declares its own lint keys. Read the rationale there before changing this.
private_intra_doc_links = "allow"

[lints.rust]
unsafe_code = "deny"
# Locks in the visibility this crate was just given: every `pub` here must be
# reachable from outside, and the only things outside are `main.rs` and
# `tests/`, so in practice it must be in `lib.rs`'s re-export list.
#
# Declared per-crate rather than switching this section to `[lints] workspace
# = true`, which is the usual way to pick up `[workspace.lints]`. Cargo does
# not let a manifest do both: `workspace = true` must be the only key in
# `[lints]`, so adopting it here would also switch on the workspace's clippy
# `pedantic` and `nursery` sets, which this crate has never been held to —
# 559 warnings, which is its own piece of work rather than a line in a
# visibility PR.
unreachable_pub = "deny"
