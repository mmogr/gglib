[package]
name = "gglib-app-services"
version.workspace = true
edition.workspace = true
description = "Shared application service ops for gglib adapters (Tauri, Axum)"
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "gglib_app_services"
path = "src/lib.rs"

[dependencies]
# Core domain and ports only - no adapter crates
gglib-core = { path = "../gglib-core" }
gglib-download = { path = "../gglib-download" }
gglib-mcp = { path = "../gglib-mcp" }
gglib-hf = { path = "../gglib-hf" }
gglib-runtime = { path = "../gglib-runtime", features = ["prebuilt"] }
# Pure-domain agentic loop (no HTTP/infra deps of its own — see its own
# Cargo.toml). Used only by the tune service to drive AgentLoop::build()
# directly with a local ScoringToolExecutorPort; compose_agent_loop() in
# gglib-runtime is not reusable here since it hardwires an MCP tool
# executor. Only gglib-agent's [dependencies] (its library) are pulled in —
# its [dev-dependencies] (e.g. test-only mock executors) never ship in any
# downstream binary, Cargo excludes them by construction.
gglib-agent = { path = "../gglib-agent" }
# The p2p tunnel behind `gglib remote` (ADR 0012). This crate owns every
# `*Ops` type, so it is where the tunnel's lifecycle lives; the CLI and the
# GUI drive it over the daemon API and never see an iroh type. Pinned to a
# git revision until 0.2.0 is on crates.io — the swap to `version = "0.2"`
# is the last edit before this lands.
modelpipe = { git = "https://github.com/mmogr/modelpipe", rev = "40387d277254589385ba5f18bf73ed9af7b99b0d", features = ["serde"] }

# Shared deps
anyhow = { workspace = true }
chrono = { workspace = true }
futures-core = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
ts-rs = { workspace = true, optional = true }

# Async
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
tokio-util = "0.7"
futures-util = "0.3"

[features]
# Emit TypeScript for the wire types. Test-driven: `cargo test --features
# ts-bindings export_bindings_` writes `src/types/generated/`. Off in every
# ordinary build, so it costs nothing at runtime and nothing in the default
# dependency graph — which is what keeps `#![deny(unused_crate_dependencies)]`
# satisfied without the feature.
#
# Forwards to `gglib-core`: the DTOs here embed domain types (`InferenceConfig`,
# `DefaultsOrigin`, …), and ts-rs needs `TS` on the whole reachable graph, not
# just the outermost struct.
ts-bindings = ["dep:ts-rs", "gglib-core/ts-bindings"]

[dev-dependencies]
tokio-test = { workspace = true }
gglib-db = { path = "../gglib-db", features = ["test-utils"] }
tempfile = { workspace = true }

[lints.rustdoc]
# Mirrors `[workspace.lints.rustdoc]`, which this crate cannot inherit while it
# declares its own lint keys. Read the rationale there before changing this.
private_intra_doc_links = "allow"

[lints.rust]
unsafe_code = "deny"
# Declared per-crate rather than via `[lints] workspace = true`: Cargo will
# not let a manifest combine that key with its own, and adopting it would
# also switch on the workspace's clippy pedantic/nursery sets this crate has
# never been held to. The five other crates in that position already carry
# this line; these three were the ones still missing it.
unreachable_pub = "deny"
