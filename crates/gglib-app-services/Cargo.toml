[package]
name = "gglib-app-services"
version.workspace = true
edition.workspace = true
description = "Shared application service ops for gglib adapters (Tauri, Axum)"
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "gglib_app_services"
path = "src/lib.rs"

[dependencies]
# Core domain and ports, plus gglib-runtime and gglib-proxy for what they own
# (the process runner, the one loopback HTTP client builder, and the proxy
# itself); no UI adapters.
gglib-core = { workspace = true }
gglib-download = { workspace = true }
gglib-mcp = { workspace = true }
gglib-runtime = { workspace = true }
# For `loopback`, the one builder of an HTTP client for a server on this machine
# (the far proxy over the pipe's local port, the benchmark's llama-server; see
# #1085), for `serve`, which the agentic eval's proxy arm starts in-process in
# front of the model it holds (#1047), and for the shapes the far proxy's model
# list and load answer with, which this side reads them into.
gglib-proxy = { workspace = true }
# Pure-domain agentic loop (no HTTP/infra deps of its own — see its own
# Cargo.toml). Used only by the tune service to drive AgentLoop::build()
# directly with a local ScoringToolExecutorPort; compose_agent_loop() in
# gglib-runtime is not reusable here since it hardwires an MCP tool
# executor. Only gglib-agent's [dependencies] (its library) are pulled in —
# its [dev-dependencies] (e.g. test-only mock executors) never ship in any
# downstream binary, Cargo excludes them by construction.
gglib-agent = { workspace = true }
# The p2p tunnel behind `gglib remote` (ADR 0012). This crate owns every
# `*Ops` type, so it is where the tunnel's lifecycle lives; the CLI and the
# GUI drive it over the daemon API and never see an iroh type.
modelpipe = { workspace = true }

# Shared deps
anyhow = { workspace = true }
chrono = { workspace = true }
futures-core = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls", "system-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }

# Async
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }

[features]
# Emit TypeScript for the wire types. Test-driven: `cargo test --features
# ts-bindings export_bindings_` writes `src/types/generated/`. Off in every
# ordinary build, so it costs nothing at runtime and nothing in the default
# dependency graph.
#
# Forwards to `gglib-core`: the DTOs here embed domain types (`InferenceConfig`,
# `DefaultsOrigin`, …), and ts-rs needs `TS` on the whole reachable graph, not
# just the outermost struct. Forwards to `gglib-proxy` for the same reason:
# `PairedModels` embeds the proxy's `ModelInfo`; and to `gglib-runtime`:
# `ImageRuntimeStatus` embeds its `SdStatus`.
ts-bindings = [
    "dep:ts-rs",
    "gglib-core/ts-bindings",
    "gglib-proxy/ts-bindings",
    "gglib-runtime/ts-bindings",
]

[dev-dependencies]
# The same tokio as above, plus the virtual clock. Declared rather than left
# to feature unification: `tokio::time::pause()` is load-bearing in the
# remote backend's watcher tests, and a dependency elsewhere in the graph
# dropping `test-util` must not be what breaks them.
tokio = { workspace = true, features = ["test-util"] }
gglib-db = { workspace = true, features = ["test-utils"] }
# A test that arms a tunnel keeps its endpoint key in a data root of this
# binary's own, not the checkout's (#955).
gglib-core = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
# The runs' privacy test reads every log line a run writes.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
