[package]
name = "gglib-hf"
description = "HuggingFace Hub client for gglib"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Internal crates
gglib-core.workspace = true

# Async runtime
tokio = { workspace = true, features = ["sync", "time"] }
async-trait.workspace = true

# Serialization
serde = { workspace = true }
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# HTTP client (rustls to avoid OpenSSL headaches)
reqwest = { workspace = true, features = ["json", "rustls"] }

# URL handling
url.workspace = true
urlencoding.workspace = true

[dev-dependencies]
# #[tokio::test] on the inline unit tests; additive with the [dependencies] set.
tokio = { workspace = true, features = ["macros", "rt"] }
