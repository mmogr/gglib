[package]
name = "gglib-download"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Download manager for gglib - handles model downloads from HuggingFace"
publish = false

[lints]
workspace = true

[dependencies]
# Internal crates
gglib-core.workspace = true
gglib-hf.workspace = true

# Async runtime
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = "0.7"
async-trait.workspace = true

# Serialization
serde = { workspace = true }
serde_json.workspace = true

# Collections
indexmap = "2.0"
uuid = { workspace = true, features = ["v4", "serde"] }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true

# HTTP client (for API calls and the native download path)
reqwest = { workspace = true }
futures-util.workspace = true
# Body chunk type handed over by reqwest's byte stream (native download sink)
bytes = "1"

# Checksum verification for downloaded files
sha2.workspace = true

# System utilities (for python env)
which = "8"
# Home directory, for locating interpreters installed by conda/pyenv/uv
dirs = { workspace = true }

[dev-dependencies]
# The virtual clock behind `#[tokio::test(start_paused = true)]`.
tokio = { workspace = true, features = ["test-util"] }
# The timestamp on a model row a test builds.
chrono.workspace = true
tempfile.workspace = true
# `Model::stored`, the row a recording registrar answers.
gglib-core = { path = "../gglib-core", features = ["test-utils"] }
