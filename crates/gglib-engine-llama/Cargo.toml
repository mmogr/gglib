[package]
name = "gglib-engine-llama"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "llama.cpp in-process: a decoder, and a server on loopback that answers gglib-proxy as the pinned llama-server does"
publish = false
build = "build.rs"

[lib]
name = "gglib_engine_llama"
path = "src/lib.rs"

[features]
# `ScriptedDecoder`, a decoder that replays a script, for other crates'
# tests. They enable it from `[dev-dependencies]` only.
test-decoder = []
# `LlamaDecoder`, the decoder over llama.h: build.rs compiles csrc/ against
# the pinned llama.framework and links it, on an Apple target with
# GGLIB_LLAMA_XCFRAMEWORK set (`make phone-llama`). Anywhere else the
# feature compiles nothing, so `--all-features` builds on every OS.
llama = ["dep:cc"]

[dependencies]
# The pin (`/props` build_info), the request a chat was asked with, and the
# runtime port, catalog, fit and device budget the in-process runtime is
# built on.
gglib-core = { workspace = true }
# A chat rendered through its template as the pinned llama-server renders it.
gglib-gguf = { workspace = true }

# The server on loopback. No sysinfo, no gglib-runtime, no gglib-proxy: this
# is a phone crate, and the proxy is its client, not its dependency.
axum = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync"] }
futures-util = { workspace = true }
# `ModelRuntimePort` is an `async_trait`.
async-trait = { workspace = true }

serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
# Compiles csrc/gglib_llama.c, under the `llama` feature only.
cc = { version = "1.2", optional = true }

[dev-dependencies]
# The tests talk to the shim over a real socket, as gglib-proxy does.
reqwest = { workspace = true, features = ["json", "stream"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The runtime's tests put each model's weights on disk, where the fit reads
# their size.
tempfile = { workspace = true }

[lints]
workspace = true
