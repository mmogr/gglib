[package]
name = "gglib-tauri"
version.workspace = true
edition.workspace = true
description = "Tauri GUI backend adapter for gglib"
license.workspace = true
publish = false

[lib]
name = "gglib_tauri"
path = "src/lib.rs"

[dependencies]
# Shared deps
serde = { workspace = true }
tracing = { workspace = true }

# Tauri-specific dependencies
# Note: version should match src-tauri/Cargo.toml
tauri = "2.8"

[lints.rust]
unsafe_code = "deny"
# Declared per-crate rather than via `[lints] workspace = true`: Cargo will
# not let a manifest combine that key with its own, and adopting it would
# also switch on the workspace's clippy pedantic/nursery sets this crate has
# never been held to. The five other crates in that position already carry
# this line; these three were the ones still missing it.
unreachable_pub = "deny"
