[package]
name = "gglib-tauri"
version.workspace = true
edition.workspace = true
description = "Tauri GUI backend adapter for gglib"
license.workspace = true
publish = false

[lib]
name = "gglib_tauri"
path = "src/lib.rs"

[dependencies]
# Shared deps
serde = { workspace = true }
tracing = { workspace = true }

# Tauri-specific dependencies
# Note: version should match src-tauri/Cargo.toml
tauri = "2.8"

[lints.rust]
unsafe_code = "deny"
