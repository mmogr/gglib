[package]
name = "gglib-runtime"
version.workspace = true
edition.workspace = true
description = "Process runtime and OS-level concerns for gglib"
license.workspace = true
publish = false

[features]
default = []
# Feature flags still gate code, but dependencies are always available to avoid missing crates on CI
prebuilt = []
cli = ["prebuilt"]

[dependencies]
gglib-agent = { path = "../gglib-agent" }
gglib-core = { path = "../gglib-core" }
gglib-mcp = { path = "../gglib-mcp" }
gglib-proxy = { path = "../gglib-proxy" }

# Runtime dependencies
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

# HTTP client for health checks and downloads
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Async utilities
futures-core = { workspace = true }
futures-util = { workspace = true }
async-stream = "0.3"
tokio-util = "0.7"

# System info
num_cpus = "1.16"
sysinfo = { workspace = true }

# Archive extraction (used by prebuilt downloads)
# Disable lzma/xz features to avoid crc version conflicts with sqlx
zip = { version = "7.1", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate", "time", "zstd"] }
# tar.gz extraction for macOS and Linux prebuilt archives
flate2 = "1"
tar = "0.4"

# Unix signal handling
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }

[lints.rustdoc]
# Mirrors `[workspace.lints.rustdoc]`, which this crate cannot inherit while it
# declares its own lint keys. Read the rationale there before changing this.
private_intra_doc_links = "allow"

[lints.rust]
unsafe_code = "deny"
# Locks in the visibility this crate was just given. Declared per-crate
# rather than via `[lints] workspace = true`, which Cargo will not let a
# manifest combine with its own lint keys and which would also adopt the
# workspace's clippy pedantic/nursery sets this crate has never been held
# to. See #844 for the eight crates in that position.
unreachable_pub = "deny"
