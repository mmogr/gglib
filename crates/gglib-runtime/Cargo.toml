[package]
name = "gglib-runtime"
version.workspace = true
edition.workspace = true
description = "Process runtime and OS-level concerns for gglib"
license.workspace = true
publish = false

[features]
default = []
# Emit TypeScript for the image runtime's status the GUI reads. Optional
# dependency, so the default graph is unchanged with the feature off.
ts-bindings = ["dep:ts-rs", "gglib-core/ts-bindings"]

[dependencies]
gglib-agent = { workspace = true }
gglib-core = { workspace = true }
gglib-mcp = { workspace = true }
gglib-proxy = { workspace = true }
ts-rs = { workspace = true, optional = true }

# Runtime dependencies
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

# HTTP client for health checks and downloads
reqwest = { workspace = true, features = ["json", "stream", "rustls", "system-proxy"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# Async utilities
futures-core = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
tokio-util = { workspace = true }

# System info
num_cpus = "1.16"
sysinfo = { workspace = true }

# Archive extraction (used by prebuilt downloads)
# Disable lzma/xz features to avoid crc version conflicts with sqlx
zip = { version = "7.1", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate", "time", "zstd"] }
# tar.gz extraction for macOS and Linux prebuilt archives
flate2 = "1"
tar = "0.4"

# Unix signal handling
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
# The virtual clock the timing tests pause and advance.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# Tests that write pidfiles do it in a data root of this binary's own (#955).
gglib-core = { workspace = true, features = ["test-utils"] }

[lints]
workspace = true
