[package]
name = "gglib-runtime"
version.workspace = true
edition.workspace = true
description = "Process runtime and OS-level concerns for gglib"
license.workspace = true
publish = false

[features]
default = []
# Emit TypeScript for the image runtime's status the GUI reads. Optional
# dependency, so the default graph is unchanged with the feature off.
ts-bindings = ["dep:ts-rs", "gglib-core/ts-bindings"]
# The contract recorder's in-process engine (`make record-upstream-inproc`):
# gglib-engine-llama's decoder over llama.h, which links llama.framework on
# macOS with GGLIB_LLAMA_XCFRAMEWORK set and nothing anywhere else. It reaches
# the tests only, through the dev-dependency.
inproc-contract = ["gglib-engine-llama/llama"]

[dependencies]
gglib-agent = { workspace = true }
gglib-core = { workspace = true }
gglib-mcp = { workspace = true }
gglib-proxy = { workspace = true }
ts-rs = { workspace = true, optional = true }

# Runtime dependencies
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

# HTTP client for health checks and downloads
reqwest = { workspace = true, features = ["json", "stream", "rustls", "system-proxy"] }

# Serialization
serde = { workspace = true }
# sd-server's images and previews arrive as base64
base64 = { workspace = true }
serde_json = { workspace = true }
# A picture drawn from is decoded, and a masked result pasted back over it
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { workspace = true }

# Async utilities
futures-core = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
tokio-util = { workspace = true }

# System info
num_cpus = "1.16"
sysinfo = { workspace = true }

# Archive extraction (used by prebuilt downloads)
# Disable lzma/xz features to avoid crc version conflicts with sqlx
zip = { version = "9.0", default-features = false, features = ["aes-crypto", "bzip2", "deflate64", "deflate", "time", "zstd"] }
# tar.gz extraction for macOS and Linux prebuilt archives
flate2 = "1"
tar = "0.4"

# Unix signal handling
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
# The virtual clock the timing tests pause and advance.
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
# Tests that write pidfiles do it in a data root of this binary's own (#955).
gglib-core = { workspace = true, features = ["test-utils"] }
# The connection a fake server answers on, with the request already read.
gglib-test-http = { workspace = true }
# The in-process engine the contract recorder asks what it asks the pinned
# llama-server, on loopback.
gglib-engine-llama = { workspace = true }

[lints]
workspace = true
