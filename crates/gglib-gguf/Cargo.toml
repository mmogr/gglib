[package]
name = "gglib-gguf"
version.workspace = true
edition.workspace = true
description = "GGUF file format parsing for gglib"
license.workspace = true
publish = false

[dependencies]
# Core domain types and port definitions
gglib-core = { path = "../gglib-core" }

# Logging
tracing = { workspace = true }

# Template render-and-diff dialect derivation (capabilities::template_probe).
# Adapter-specific deps stay local to this crate per the workspace policy.
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
