[package]
name = "gglib-axum"
version.workspace = true
edition.workspace = true
description = "Axum web server adapter for gglib"
license.workspace = true
publish = false

[lib]
name = "gglib_axum"
path = "src/lib.rs"

[dependencies]
gglib-app-services = { workspace = true }
gglib-bootstrap = { workspace = true }
gglib-build-info.workspace = true
gglib-core = { workspace = true }
gglib-db = { workspace = true }
gglib-gguf = { workspace = true }  # GGUF_BOOTSTRAP_EXCEPTION: ToolSupportDetector
gglib-mcp = { workspace = true }
# For `loopback`, the one builder of an HTTP client for a server on this machine (#1085),
# and for `runs::sse`, which frames a run's events for this crate's door and the proxy's alike.
gglib-proxy = { workspace = true }
gglib-runtime = { workspace = true, features = ["cli"] }
gglib-sse = { workspace = true }

# Shared deps
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls", "system-proxy"] }

# Axum-specific dependencies - use workspace versions for consistency
axum = { workspace = true }
tower-http = { workspace = true }
futures-util = { workspace = true }
futures-core = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
ts-rs = { workspace = true, optional = true }

# The dashboard, compiled into the binary. See `src/ui.rs`.
#
# `mime-guess` (hyphen) is rust-embed's own feature: it bakes each file's
# content type into the generated `Metadata` at compile time. The similarly
# named `mime_guess` (underscore) feature is the optional dependency
# rust-embed's framework examples use, and bakes in nothing.
#
# `debug-embed` makes every profile use the `include_bytes!` implementation.
# Without it rust-embed gates that on `#[cfg(not(debug_assertions))]` and debug
# builds get a *filesystem* implementation that walks an absolute path baked in
# at compile time. That split is worse than it sounds: no CI job and no test
# builds with `--release`, so the code that actually ships would first compile
# on a release runner at tag time, and `cargo build && rm -rf web_ui` would
# reproduce the very "dashboard silently missing" failure this module exists to
# remove — keyed to the build profile instead of the working directory. The
# cost is that a debug binary carries the assets too.
rust-embed = { version = "8.12", features = ["mime-guess", "debug-embed"] }

[features]
# Emit TypeScript for this crate's HTTP wire types. Optional dependency, so
# nothing enters the build graph with the feature off. Forwards to the crates
# whose types these bodies embed — ts-rs needs `TS` on the whole reachable
# graph, not just the outermost struct.
ts-bindings = ["dep:ts-rs", "gglib-core/ts-bindings", "gglib-app-services/ts-bindings"]

[dev-dependencies]
# A test refuses one kind of row with a trigger, to see a reply saved whole or not at all.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
# Re-declared to turn on `test-support`, which carries
# `Broadcaster::subscribe_events`. The feature stays off in the normal build.
gglib-sse = { workspace = true, features = ["test-support"] }
# A data root of each test binary's own, so a context resolves nothing into
# the checkout (#955).
gglib-core = { workspace = true, features = ["test-utils"] }
# The timestamp on a model row a test builds.
chrono = { workspace = true }
# Tests that read back what the code under test logged.
tracing-subscriber = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
