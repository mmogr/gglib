[package]
name = "gglib-axum"
version.workspace = true
edition.workspace = true
description = "Axum web server adapter for gglib"
license.workspace = true
publish = false

[lib]
name = "gglib_axum"
path = "src/lib.rs"

[dependencies]
gglib-app-services = { path = "../gglib-app-services" }
gglib-bootstrap = { path = "../gglib-bootstrap" }
gglib-core = { path = "../gglib-core" }
gglib-db = { path = "../gglib-db" }
gglib-gguf = { path = "../gglib-gguf" }  # GGUF_BOOTSTRAP_EXCEPTION: ToolSupportDetector
gglib-mcp = { path = "../gglib-mcp" }
gglib-runtime = { path = "../gglib-runtime", features = ["cli"] }
gglib-sse = { path = "../gglib-sse" }

# Shared deps
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = "0.7"
anyhow = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }

# Axum-specific dependencies - use workspace versions for consistency
axum = { workspace = true }
tower-http = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }
futures-core = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
ts-rs = { workspace = true, optional = true }

# The dashboard, compiled into the binary. See `src/ui.rs`.
#
# `mime-guess` (hyphen) is rust-embed's own feature: it bakes each file's
# content type into the generated `Metadata` at compile time. The similarly
# named `mime_guess` (underscore) feature would instead add mime_guess as a
# direct dependency of this crate, which `#![deny(unused_crate_dependencies)]`
# would then require us to name in code. One dependency, not two.
#
# `debug-embed` makes every profile use the `include_bytes!` implementation.
# Without it rust-embed gates that on `#[cfg(not(debug_assertions))]` and debug
# builds get a *filesystem* implementation that walks an absolute path baked in
# at compile time. That split is worse than it sounds: no CI job and no test
# builds with `--release`, so the code that actually ships would first compile
# on a release runner at tag time, and `cargo build && rm -rf web_ui` would
# reproduce the very "dashboard silently missing" failure this module exists to
# remove — keyed to the build profile instead of the working directory. The
# cost is that a debug binary carries the assets too.
rust-embed = { version = "8.12", features = ["mime-guess", "debug-embed"] }

[features]
# Emit TypeScript for this crate's HTTP wire types. Optional dependency, so
# nothing enters the build graph with the feature off and
# `#![deny(unused_crate_dependencies)]` stays satisfied. Forwards to the crates
# whose types these bodies embed — ts-rs needs `TS` on the whole reachable
# graph, not just the outermost struct.
ts-bindings = ["dep:ts-rs", "gglib-core/ts-bindings", "gglib-app-services/ts-bindings"]

[dev-dependencies]
# Re-declared to turn on `test-support`, which carries
# `Broadcaster::subscribe_events`. The feature stays off in the normal build.
gglib-sse = { path = "../gglib-sse", features = ["test-support"] }
tokio-test = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1.0"
tempfile = "3.10"

[lints.rustdoc]
# Mirrors `[workspace.lints.rustdoc]`, which this crate cannot inherit while it
# declares its own lint keys. Read the rationale there before changing this.
private_intra_doc_links = "allow"

[lints.rust]
unsafe_code = "deny"
# Locks in the visibility this crate was just given. Declared per-crate
# rather than via `[lints] workspace = true`, which Cargo will not let a
# manifest combine with its own lint keys and which would also adopt the
# workspace's clippy pedantic/nursery sets this crate has never been held
# to. See #844 for the eight crates in that position.
unreachable_pub = "deny"
