[package]
name = "gglib-bootstrap"
version.workspace = true
edition.workspace = true
description = "Shared composition root for gglib adapters — wires infrastructure without adapter concerns"
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "gglib_bootstrap"
path = "src/lib.rs"

[dependencies]
# Internal crates — strictly infrastructure wiring only; no adapter crates (mcp, tauri, axum)
gglib-core = { workspace = true }
gglib-db = { workspace = true }
gglib-download = { workspace = true }
gglib-gguf = { workspace = true }
gglib-hf = { workspace = true }

# The download trigger implements an async port
async-trait = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
chrono = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
