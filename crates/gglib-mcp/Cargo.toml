[package]
name = "gglib-mcp"
version.workspace = true
edition.workspace = true
description = "MCP (Model Context Protocol) server management for gglib"
license.workspace = true
publish = false

[dependencies]
# Core domain types and ports only - no sqlx
gglib-build-info.workspace = true
gglib-core = { workspace = true }

# Async runtime. `macros` is for `tokio::join!` in `combined.rs`, `process`
# for the server child in `client.rs`, and `rt` for the task that drains its
# stderr in `stderr_tail.rs` and the builtin file tools' `spawn_blocking`;
# without them this crate only compiles when something else in the build graph
# turns the features on, so `cargo check -p gglib-mcp` alone fails.
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

# Async trait
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
# A tool's image items carry their bytes as base64
base64 = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
# `test-util` for `#[tokio::test(start_paused = true)]`: the ping a server
# never answers is waited out on the virtual clock.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
