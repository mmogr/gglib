[package]
name = "gglib-mcp"
version.workspace = true
edition.workspace = true
description = "MCP (Model Context Protocol) server management for gglib"
license.workspace = true
publish = false

[features]
# `StandIn`, an MCP server a test starts, the same program on every OS. Other
# crates enable it from `[dev-dependencies]` only, so no ordinary build has
# it or the two crates it needs.
test-utils = ["dep:gglib-test-proc", "dep:tempfile"]

[dependencies]
# Core domain types and ports only - no sqlx
gglib-build-info.workspace = true
gglib-core = { workspace = true }

# Async runtime. `macros` is for `tokio::join!` in `combined.rs`, `process`
# for the server child in `client.rs`, and `rt` for the task that drains its
# stderr in `stderr_tail.rs` and the builtin file tools' `spawn_blocking`;
# without them this crate only compiles when something else in the build graph
# turns the features on, so `cargo check -p gglib-mcp` alone fails.
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

# Async trait
async-trait = { workspace = true }

# `join_all`: this machine's run starts the servers it reads at once, not one
# after another, so one that hangs does not add its wait to every other's.
futures-util = { workspace = true }

# Serialization
serde = { workspace = true }
# A tool's image items carry their bytes as base64
base64 = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# `test-utils` only: the stand-in MCP server's program, and its folder.
gglib-test-proc = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
# `test-utils` so a test here is refused the user's own data folder (#2088).
gglib-core = { workspace = true, features = ["test-utils"] }
# `test-util` for `#[tokio::test(start_paused = true)]`: the ping a server
# never answers is waited out on the virtual clock.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = { workspace = true }
# The stand-in MCP server (`stand_in.rs`), a server that exits or prints
# (client_tests.rs), and one behind a shim, with whether the process behind
# it still runs once the client has stopped it (client_stop_tests.rs).
gglib-test-proc = { workspace = true }
sysinfo = { workspace = true }

[lints]
workspace = true
