[package]
name = "gglib-proxy"
version.workspace = true
edition.workspace = true
description = "OpenAI-compatible proxy server for gglib"
license.workspace = true
publish = false
build = "build.rs"

[features]
default = []
# Exposes the two `cache_lifecycle` items this crate's own `tests/` need,
# and the stream bounds they shorten. They link the crate as an external
# consumer, so `#[cfg(test)]` does not reach them — mirrors `gglib-db`'s
# `test-utils`.
test-support = []
# Emit TypeScript for the dashboard/audit records the GUI reads. Optional
# dependency, so the default graph is unchanged with the feature off.
ts-bindings = ["dep:ts-rs", "gglib-core/ts-bindings"]

[dependencies]
# Core domain types and ports (NO runtime, NO sqlx)
gglib-build-info.workspace = true
gglib-core = { workspace = true }
ts-rs = { workspace = true, optional = true }

# MCP service for tool gateway
gglib-mcp = { workspace = true }

# Generic SSE broadcast utility, shared with gglib-axum (no gglib-* deps of its own)
gglib-sse = { workspace = true }

# HTTP server
axum = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }

# CORS middleware — the Tauri GUI's webview runs on the `tauri://localhost`
# (and `http://tauri.localhost` on Windows) origin, which browsers treat as
# cross-origin relative to this proxy's `127.0.0.1:<port>` origin; without
# this, EventSource/fetch calls to the proxy are blocked by CORS.
tower-http = { workspace = true }

# HTTP client for forwarding
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }

# HTTP body handling
bytes = { workspace = true }

# Async utilities
futures-util = { workspace = true }
async-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Text processing
regex = "1"

# Content-derived fallback session ID hashing (cache_lifecycle)
sha2 = { workspace = true }

# Session ID generation
uuid = { workspace = true, features = ["v4"] }

# Free-disk-space probing for auto-sized slot cache eviction
sysinfo = { workspace = true }

[dev-dependencies]
# Self-dependency purely to enable `test-support` for `tests/`; the
# feature stays off for anyone who depends on this crate normally.
gglib-proxy = { workspace = true, features = ["test-support"] }
# Same arrangement for the SSE broadcaster's raw-stream door, which the
# dashboard publisher test observes through.
gglib-sse = { workspace = true, features = ["test-support"] }
# `test-util` is what `#[tokio::test(start_paused = true)]` needs, and it is
# deliberately not part of tokio's `full`. Declared here rather than left to
# feature unification, so the contention tests do not rest on what another
# crate in the graph happens to enable.
tokio = { workspace = true, features = ["test-util"] }
# The port doubles the tests implement.
async-trait = { workspace = true }
# `test-utils` for the doubles the tests share with other crates:
# `ModelSummary::bare`, `NamedCatalog` and `InMemorySettings`.
gglib-core = { workspace = true, features = ["test-utils"] }
http-body-util = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
# For the two suites that put a real tunnel in front of a real proxy rather
# than synthesising the edge's headers: `integration_remote_tunnel.rs`, about
# a request crossing the pipe at all, and `integration_remote_devices.rs`,
# about which credentials get to cross it. Both run over `fixtures::tunnel`.
# Every other remote test synthesises those headers, which proves what the
# proxy does with a request that claims to have come through a tunnel rather
# than one that did.
modelpipe = { workspace = true }

[lints]
workspace = true
