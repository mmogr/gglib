[package]
name = "gglib-proxy"
version.workspace = true
edition.workspace = true
description = "OpenAI-compatible proxy server for gglib"
license.workspace = true
publish = false
build = "build.rs"

[features]
default = []
# Exposes the two `cache_lifecycle` items this crate's own `tests/` need.
# They link the crate as an external consumer, so `#[cfg(test)]` does not
# reach them — mirrors `gglib-db`'s `test-utils`.
test-support = []
# Emit TypeScript for the dashboard/audit records the GUI reads. Optional
# dependency, so the default graph is unchanged and
# `#![deny(unused_crate_dependencies)]` stays satisfied with the feature off.
ts-bindings = ["dep:ts-rs", "gglib-core/ts-bindings"]

[dependencies]
# Core domain types and ports (NO runtime, NO sqlx)
gglib-core = { path = "../gglib-core" }
ts-rs = { workspace = true, optional = true }

# MCP service for tool gateway
gglib-mcp = { path = "../gglib-mcp" }

# Generic SSE broadcast utility, shared with gglib-axum (no gglib-* deps of its own)
gglib-sse = { workspace = true }

# HTTP server
axum = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }

# CORS middleware — the Tauri GUI's webview runs on the `tauri://localhost`
# (and `http://tauri.localhost` on Windows) origin, which browsers treat as
# cross-origin relative to this proxy's `127.0.0.1:<port>` origin; without
# this, EventSource/fetch calls to the proxy are blocked by CORS.
tower-http = { workspace = true }

# HTTP client for forwarding
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }

# HTTP body handling
bytes = "1"

# Async utilities
futures-util = "0.3"
futures-core = "0.3"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Text processing
regex = "1"

# Content-derived fallback session ID hashing (cache_lifecycle)
sha2 = "0.10"

# Concurrent collections
dashmap = "6"

# Session ID generation
uuid = { workspace = true, features = ["v4"] }

# Async trait support
async-trait = "0.1"

# Free-disk-space probing for auto-sized slot cache eviction
sysinfo = { workspace = true }

[dev-dependencies]
# Self-dependency purely to enable `test-support` for `tests/`; the
# feature stays off for anyone who depends on this crate normally.
gglib-proxy = { path = ".", features = ["test-support"] }
# Same arrangement for the SSE broadcaster's raw-stream door, which the
# dashboard publisher test observes through.
gglib-sse = { workspace = true, features = ["test-support"] }
# `test-util` is what `#[tokio::test(start_paused = true)]` needs, and it is
# deliberately not part of tokio's `full`. Declared explicitly rather than
# inherited: it currently arrives only because `tokio-test` happens to enable
# it, so removing that dependency would silently break the contention tests.
tokio = { version = "1.0", features = ["test-util"] }
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = { workspace = true }
serde_json = "1.0"

[lints.rustdoc]
# Mirrors `[workspace.lints.rustdoc]`, which this crate cannot inherit while it
# declares its own lint keys. Read the rationale there before changing this.
private_intra_doc_links = "allow"

[lints.rust]
# This crate had no `[lints]` section, so it inherited and enforced nothing.
# Locks in the visibility this crate was just given. Declared per-crate
# rather than via `[lints] workspace = true`, which Cargo will not let a
# manifest combine with its own lint keys and which would also adopt the
# workspace's clippy pedantic/nursery sets this crate has never been held
# to. See #844 for the eight crates in that position.
unreachable_pub = "deny"
