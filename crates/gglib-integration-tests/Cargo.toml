[package]
name = "gglib-integration-tests"
version.workspace = true
edition.workspace = true
description = "Cross-crate integration tests for gglib (add/question command flows, chat parity, HuggingFace client, model serialization, path resolution, server defaults, validation)"
license.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
# `test-utils` for a data root of each test binary's own (#955).
gglib-core = { workspace = true, features = ["test-utils"] }
gglib-db = { workspace = true, features = ["test-utils"] }
gglib-hf = { workspace = true }
gglib-gguf = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
urlencoding = { workspace = true }
