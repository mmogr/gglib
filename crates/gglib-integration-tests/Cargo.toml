[package]
name = "gglib-integration-tests"
version.workspace = true
edition.workspace = true
description = "Cross-crate integration tests for gglib, gglib-proxy in front of the phone's in-process runtime among them"
license.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
# `test-utils` for a data root of each test binary's own (#955).
gglib-core = { workspace = true, features = ["test-utils"] }
gglib-db = { workspace = true, features = ["test-utils"] }
# `test-utils` for the GGUF file the import tests parse.
gglib-gguf = { workspace = true, features = ["test-utils"] }
# The phone's composition: gglib-proxy served over the in-process runtime,
# whose decoder is scripted (`test-decoder`).
gglib-engine-llama = { workspace = true, features = ["test-decoder"] }
gglib-mcp = { workspace = true }
gglib-proxy = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-util = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
