[package]
name = "gglib-db"
version.workspace = true
edition.workspace = true
description = "SQLite repository implementations for gglib"
license.workspace = true
publish = false

[features]
test-utils = []

[dependencies]
gglib-core = { workspace = true }

# Universal dependencies
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }

# DB-specific dependencies
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono"] }
libsqlite3-sys = { version = "0.30", features = ["bundled", "unlock_notify"] }

[dev-dependencies]
# The hub and download doubles a repair runs against, in the tests that drive
# core's verification over the real repositories.
gglib-core = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true }
# #[tokio::test] on the inline unit tests; additive with the [dependencies] set.
tokio = { workspace = true, features = ["macros", "rt"] }

[package.metadata.cargo-shear]
# Named nowhere in code: it sets the features of the SQLite that sqlx links.
ignored = ["libsqlite3-sys"]

[lints]
workspace = true
