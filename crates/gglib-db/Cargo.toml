[package]
name = "gglib-db"
version.workspace = true
edition.workspace = true
description = "SQLite repository implementations for gglib"
license.workspace = true
publish = false

[features]
default = ["sqlite"]
sqlite = []
test-utils = []

[dependencies]
gglib-core = { path = "../gglib-core" }

# Universal dependencies
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }

# DB-specific dependencies - defined locally, not in workspace
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono"] }
libsqlite3-sys = { version = "0.30", features = ["bundled", "unlock_notify"] }

[dev-dependencies]
tempfile = { workspace = true }
# #[tokio::test] on the inline unit tests; additive with the [dependencies] set.
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-test = { workspace = true }

[lints.rustdoc]
# Mirrors `[workspace.lints.rustdoc]`, which this crate cannot inherit while it
# declares its own lint keys. Read the rationale there before changing this.
private_intra_doc_links = "allow"

[lints.rust]
unsafe_code = "deny"
# Declared per-crate rather than via `[lints] workspace = true`: Cargo will
# not let a manifest combine that key with its own, and adopting it would
# also switch on the workspace's clippy pedantic/nursery sets this crate has
# never been held to. The five other crates in that position already carry
# this line; these three were the ones still missing it.
unreachable_pub = "deny"
