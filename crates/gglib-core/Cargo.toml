[package]
name = "gglib-core"
version.workspace = true
edition.workspace = true
description = "Core domain types and port definitions for gglib"
license.workspace = true
publish = false

[dependencies]
# Only deps actually used in core - no adapter-specific crates
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
bitflags = { version = "2.6", features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v4"] }
getrandom = "0.4"
tokio = { workspace = true, features = ["fs", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
sha2 = { workspace = true }
futures-core = { workspace = true }
url = { workspace = true }
ts-rs = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[features]
# Emit TypeScript for the types that cross the wire. Enabled transitively by
# the adapter crates' own `ts-bindings`, never on its own in an ordinary build.
ts-bindings = ["dep:ts-rs"]
# A data root of a test binary's own, which `data_root()` and
# `resource_root()` answer before anything else (#955). Other crates enable it
# from `[dev-dependencies]` only, so no ordinary build can set that root.
test-utils = ["dep:tempfile"]

# Run only with `test-utils`, which `cargo test` at the workspace root turns
# on through gglib-runtime's dev-dependency on this crate.
[[test]]
name = "isolated_data_root"
required-features = ["test-utils"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
