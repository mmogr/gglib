[package]
name = "gglib-core"
version.workspace = true
edition.workspace = true
description = "Core domain types and port definitions for gglib"
license.workspace = true
publish = false

[dependencies]
# Only deps actually used in core - no adapter-specific crates
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
bitflags = { version = "2.6", features = ["serde"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
tokio = { workspace = true, features = ["fs", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
sha2 = "0.10"
futures-core = "0.3"
url = "2.5"
ts-rs = { workspace = true, optional = true }

[features]
# Emit TypeScript for the domain types that cross the wire. See this crate's
# `domain` module docs for which do and why. Enabled transitively by the
# adapter crates' own `ts-bindings`, never on its own in an ordinary build.
ts-bindings = ["dep:ts-rs"]

[dev-dependencies]
mockall = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-test = { workspace = true }

[lints]
workspace = true
