[package]
name = "gglib-core"
version.workspace = true
edition.workspace = true
description = "Core domain types and port definitions for gglib"
license.workspace = true
publish = false

[dependencies]
# Only deps actually used in core - no adapter-specific crates
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
dotenvy = { workspace = true }
bitflags = { version = "2.6", features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v4"] }
getrandom = "0.4"
tokio = { workspace = true, features = ["fs", "macros", "process", "rt", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
sha2 = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
ts-rs = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

# utils::process::host, the one place Windows is called directly (ADR 0030). The version
# tokio already resolves, so no second copy is built.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# utils::process::tree signals a process group on a desktop Unix (macOS, Linux).
# Not on iOS: gglib starts no process on a phone, and a phone build must not link
# nix (scripts/check_phone_closure.sh). The version and feature gglib-runtime
# already resolves, so no second copy is built.
[target.'cfg(all(unix, not(target_os = "ios")))'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[features]
# Emit TypeScript for the types that cross the wire. Enabled transitively by
# the adapter crates' own `ts-bindings`, never on its own in an ordinary build.
ts-bindings = ["dep:ts-rs"]
# A data root of a test binary's own, which `data_root()` and
# `resource_root()` answer before anything else (#955), and their refusal of
# the user's own folder to a test that set none (#2088), and `link_folder`
# and `unwritable_folder`, the folder link and the folder that refuses a
# write a test makes the same way on every OS. Other crates enable
# it from `[dev-dependencies]` only, so no ordinary build has any of them.
test-utils = ["dep:tempfile"]

# Run only with `test-utils`, which `cargo test` at the workspace root turns
# on through gglib-runtime's dev-dependency on this crate.
[[test]]
name = "isolated_data_root"
required-features = ["test-utils"]

[dev-dependencies]
gglib-test-proc = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[lints]
workspace = true
