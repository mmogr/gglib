[package]
name = "gglib-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The Swift-facing surface of gglib, shipped as a dynamic framework for iOS and macOS"
publish = false
build = "build.rs"

[lib]
name = "gglib_ffi"
path = "src/lib.rs"
# cdylib is the binary inside GglibFFI.framework, and the library
# `uniffi-bindgen` reads the scaffolding out of; lib (rlib) is what this
# crate's own tests link. A dynamic library rather than a static one, so its
# Rust runtime cannot clash with the static one modelpipe-ffi links into the
# same app.
crate-type = ["cdylib", "lib"]

[[bin]]
# The Swift generator, built from this crate's own `uniffi` so the generated
# Swift cannot disagree with the scaffolding compiled into the library. Behind
# `bindgen` so a build of the library for a phone never compiles the
# generator's dependencies (clap among them).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
# Adds a GGUF already on disk to a library, for the Swift smoke test, which
# serves a real model through the binding and has no call to add one: a phone
# gets its models by download. Behind `smoke` so a phone build never compiles
# it.
name = "gglib-ffi-add-model"
path = "src/bin/add-model.rs"
required-features = ["smoke"]

[features]
# The generator and what it needs: `cli` for its command line, and
# `cargo-metadata` because that is how library mode finds this crate's
# uniffi.toml, which names the module the generated Swift imports.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]
# The engine `Library::serve` starts decodes with llama.cpp: the phone
# engine's decoder over llama.h, linked on an Apple target when
# GGLIB_LLAMA_XCFRAMEWORK names the framework `make phone-llama` builds
# (scripts/apple/build-xcframework.sh sets both). Anywhere else it compiles
# nothing, and `serve` answers `EngineUnavailable`.
llama = ["gglib-engine-llama/llama"]
# `gglib-ffi-add-model`, the Swift smoke test's helper.
smoke = []

[dependencies]
gglib-core = { workspace = true }
# The composition root a library is opened through: its database, its Hub
# client and its download manager, wired as every other surface wires them.
gglib-bootstrap = { workspace = true }
# The same minor as modelpipe-ffi's: both bindings sit in one app, and their
# generated headers share the definitions behind `UNIFFI_SHARED_H`. No
# default features: the only one is `cargo-metadata`, which only the
# generator uses.
uniffi = { version = "0.32", default-features = false }
# Multi-thread, for the runtime every async export enters (`src/runtime.rs`);
# `sync` for the channel a download watch waits on; `time` for how long a
# pause waits for its downloads to stop; `net` for the port a served proxy
# listens on.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "net"] }
# A repository's quantization heads, read a few at a time.
futures-util = { workspace = true }
# `GglibError`'s words.
thiserror = { workspace = true }
# What `Library::serve` composes: gglib's own proxy on loopback, in front of
# the in-process runtime that fits one model at a time to the device, with an
# MCP service over the library's (empty) table of servers.
gglib-proxy = { workspace = true }
gglib-engine-llama = { workspace = true }
gglib-mcp = { workspace = true }
# The token that stops a served proxy.
tokio-util = { workspace = true }
# Each serve's bearer key, from the OS's random source.
getrandom = "0.4"
# What a served engine says when its proxy stops on its own.
tracing = { workspace = true }

[dev-dependencies]
# `net` and `io-util` for the fake file server the download tests fetch
# from.
tokio = { workspace = true, features = ["net", "io-util"] }
# The Hub a test library is built over.
async-trait = { workspace = true }
# The connection the fake file server answers on, with the request read.
gglib-test-http = { workspace = true }
# The Hub's recorded answers the fake Hub reads.
serde_json = { workspace = true }
# The digest the fake file server gives a file, as the Hub does.
sha2 = { workspace = true }
# The library's folders in a test.
tempfile = { workspace = true }
# `paths::isolate_data_root`, so a test's library never finds the user's own
# gglib folder (the download accelerator's environment is looked for there).
gglib-core = { workspace = true, features = ["test-utils"] }
# When a model a test stores was added.
chrono = { workspace = true }
# A served engine in a test decodes with a script, on any OS.
gglib-engine-llama = { workspace = true, features = ["test-decoder"] }
# The requests a test sends a served proxy.
reqwest = { workspace = true, features = ["json"] }

[lints]
workspace = true
