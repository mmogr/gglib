# A hand-written fake HTTP server in a test takes its connections from
# gglib-test-http, which hands a stream over only once its request has been
# read whole. A fake that answers first races its client: on tokio 1.54 an
# accepted socket starts writable, the answer can reach hyper before hyper has
# sent its request, and hyper cancels it (#1553, #1556). No production code in
# this workspace calls these; its servers are axum::serve. The helper's own two
# calls carry the only exceptions.
#
# axum's Listener trait is listed too: in a crate that has axum, calling it on
# a listener hands back a raw stream the same way.
#
# No `replacement`: clippy would offer it as a machine-applicable rewrite of
# the method name, which is not how the helper is called. `allow-invalid` on
# the tokio and axum entries because a single-crate check of a crate whose
# dependencies do not reach `tokio::net` or axum cannot resolve the path, and
# would print a warning for it on every target.
#
# A program is started through gglib_core::utils::process (ADR 0030): `cmd`
# or `async_cmd`, which keep a child from opening a console window on Windows,
# `detached::spawn_daemon` for the service, and `tree::spawn` for a child
# that is stopped with what it starts. That module holds the only
# calls to the methods below; the creation flags and process group they set
# are set nowhere else. `allow-invalid` on the ones that exist on one OS
# only, so the other OSes' clippy can leave them unresolved.
#
# A path is canonicalized through gglib_core::paths::canonical. On Windows
# `canonicalize` writes a verbatim path (`\\?\C:\...`) that many programs
# refuse and that names a file by a second string; the owner writes it as a
# plain path where one can be written. `allow-invalid` on tokio's, which a
# crate without tokio's `fs` feature cannot resolve.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "start a program with gglib_core::utils::process::cmd, which opens no console window on Windows" },
    { path = "tokio::process::Command::new", reason = "start a program with gglib_core::utils::process::async_cmd, which opens no console window on Windows", allow-invalid = true },
    { path = "std::os::windows::process::CommandExt::creation_flags", reason = "the creation flags are set in gglib_core::utils::process only", allow-invalid = true },
    { path = "tokio::process::Command::creation_flags", reason = "the creation flags are set in gglib_core::utils::process only", allow-invalid = true },
    { path = "std::os::unix::process::CommandExt::process_group", reason = "a process group is set in gglib_core::utils::process only: detached::spawn_daemon for the service, tree::spawn for a child stopped with what it starts", allow-invalid = true },
    { path = "tokio::process::Command::process_group", reason = "a process group is set in gglib_core::utils::process only: detached::spawn_daemon for the service, tree::spawn for a child stopped with what it starts", allow-invalid = true },
    { path = "std::fs::canonicalize", reason = "canonicalize with gglib_core::paths::canonical, which writes no verbatim prefix on Windows" },
    { path = "std::path::Path::canonicalize", reason = "canonicalize with gglib_core::paths::canonical, which writes no verbatim prefix on Windows" },
    { path = "tokio::fs::canonicalize", reason = "canonicalize with gglib_core::paths::canonical, which writes no verbatim prefix on Windows", allow-invalid = true },
    { path = "tokio::net::TcpListener::accept", reason = "a fake server takes its connection from gglib_test_http::accept, or ::incoming and then Incoming::request, so the request is read first", allow-invalid = true },
    { path = "tokio::net::TcpListener::poll_accept", reason = "a fake server takes its connection from gglib_test_http::incoming, whose Incoming gives no stream until the request is read", allow-invalid = true },
    { path = "axum::serve::Listener::accept", reason = "a fake server takes its connection from gglib_test_http::accept, or ::incoming and then Incoming::request, so the request is read first", allow-invalid = true },
    { path = "std::net::TcpListener::accept", reason = "a fake server takes its connection from gglib_test_http::blocking::accept, or ::incoming and then Incoming::request, so the request is read first" },
    { path = "std::net::TcpListener::incoming", reason = "a fake server takes its connections from gglib_test_http::blocking::incoming in a loop, whose Incoming gives no stream until the request is read" },
]
