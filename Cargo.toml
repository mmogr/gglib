[workspace]
# Edition-2024 packages default to resolver 3, but a virtual manifest has no
# edition to infer from and must state it. Resolver 3 adds MSRV-aware version
# selection; rust-toolchain.toml pins 1.97.1, well past the 1.84 it needs.
resolver = "3"
members = [
    "crates/gglib-core",
    "crates/gglib-db",
    "crates/gglib-download",
    "crates/gglib-gguf",
    "crates/gglib-bootstrap",
    "crates/gglib-app-services",
    "crates/gglib-hf",
    "crates/gglib-build-info",
    "crates/gglib-mcp",
    "crates/gglib-proxy",
    "crates/gglib-runtime",
    "crates/gglib-agent",
    "crates/gglib-sse",
    "crates/gglib-cli",
    "crates/gglib-axum",
    "crates/gglib-tauri",
    "crates/gglib-integration-tests",
    # Tauri desktop app (gglib-app binary)
    "src-tauri",
]

# Shared package metadata for all workspace crates
[workspace.package]
version = "0.13.0"
edition = "2024"
license = "AGPL-3.0"
repository = "https://github.com/mmogr/gglib"
authors = ["mmogr"]

# Workspace-wide dependencies: ONLY truly universal crates
# Adapter-specific deps (sqlx, clap, tauri, axum) are defined locally per crate
[workspace.dependencies]
# Async runtime.
#
# Deliberately NO features here. Features declared in [workspace.dependencies]
# are additive and unconditional — every inheriting crate gets them — so listing
# any would defeat the per-crate sets below. Each crate declares exactly what it
# uses via `tokio = { workspace = true, features = [...] }`.
#
# Note this does not shorten a full workspace build: Cargo unifies features
# across the graph, and gglib-download/gglib-runtime between them already need
# most of `full`. The win is honest manifests and cheap single-crate builds
# (`cargo check -p gglib-sse` no longer compiles process, net and signal).
tokio = { version = "1.0" }
tokio-test = "0.4"

# Futures / async streams
# Both crates are published in lock-step from the same futures-rs release; using
# the same constraint here ensures Cargo always resolves them to the same version.
futures-util = { version = "0.3" }
futures-core = { version = "0.3" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Encoding
base64 = "0.22"

# Hashing (download checksum verification)
sha2 = "0.10"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = { version = "0.2" }

# Async traits
async-trait = "0.1.89"

# Filesystem/system utilities
dirs = "6.0"

# HuggingFace Hub SDK
hf-hub = "0.4"

# HTTP/Networking
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
indicatif = "0.18"
crossterm = "0.29"
termimad = "0.34.1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1.10", features = ["v4"] }

# Tauri
tauri = { version = "2.8.5", features = ["devtools", "tray-icon", "image-png"] }
tauri-build = { version = "2.4.1", features = [] }
tauri-plugin-dialog = "2.6"
tauri-plugin-autostart = "2"
dotenvy = "0.15"
open = "5"

# Linux tray panel placement. Versions match what Tauri already resolves, so
# these add no new copies to the tree; `gtk` in particular must stay in step
# with Tauri's or the GtkWindow types will not unify.
gtk = "0.18"
libloading = "0.7"
# StatusNotifierItem tray. Default features pull zbus/tokio, matching Tauri's
# runtime rather than starting a second one.
ksni = "0.3"

# System info
sysinfo = "0.37"

# Testing
tempfile = "3.8"
mockall = "0.14"
gglib-core = { path = "crates/gglib-core" }
gglib-db = { path = "crates/gglib-db", features = ["test-utils"] }
gglib-download = { path = "crates/gglib-download" }
gglib-gguf = { path = "crates/gglib-gguf" }
gglib-hf = { path = "crates/gglib-hf" }
gglib-runtime = { path = "crates/gglib-runtime" }
gglib-sse = { path = "crates/gglib-sse" }
gglib-axum = { path = "crates/gglib-axum" }
gglib-app-services = { path = "crates/gglib-app-services" }
gglib-tauri = { path = "crates/gglib-tauri" }
gglib-build-info = { path = "crates/gglib-build-info" }

# Workspace-wide lints for consistency
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow these common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
collapsible_if = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Irreconcilable with `unreachable_pub`, which this workspace is adopting so the
# compiler can see dead code. For an item in a private module the two lints ask
# for opposite things: `pub` trips `unreachable_pub`, `pub(crate)` trips this.
# One of them has to be off, and this is the nursery one — and the one whose
# advice hides dead code, since `pub` is exactly what stops `dead_code` looking.
redundant_pub_crate = "allow"

# Profile settings apply to all workspace members
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 0

# Optimize dependencies even in debug builds. Our own code stays at opt-level 0
# so incremental rebuilds remain fast, but third-party crates compile once and
# stay optimized — which matters a lot here, where debug builds hash multi-GB
# GGUF files through sha2 and stream downloads through reqwest/rustls.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 3

