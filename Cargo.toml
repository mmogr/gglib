[workspace]
# Edition-2024 packages default to resolver 3, but a virtual manifest has no
# edition to infer from and must state it. Resolver 3 adds MSRV-aware version
# selection; rust-toolchain.toml pins 1.97.1, well past the 1.84 it needs.
resolver = "3"
members = [
    "crates/gglib-core",
    "crates/gglib-db",
    "crates/gglib-download",
    "crates/gglib-gguf",
    "crates/gglib-bootstrap",
    "crates/gglib-app-services",
    "crates/gglib-hf",
    "crates/gglib-build-info",
    "crates/gglib-mcp",
    "crates/gglib-proxy",
    "crates/gglib-runtime",
    "crates/gglib-agent",
    "crates/gglib-sse",
    "crates/gglib-cli",
    "crates/gglib-axum",
    "crates/gglib-tauri",
    "crates/gglib-integration-tests",
    # Tauri desktop app (gglib-app binary)
    "src-tauri",
]

# Shared package metadata for all workspace crates
[workspace.package]
version = "0.15.0"
edition = "2024"
license = "AGPL-3.0"
repository = "https://github.com/mmogr/gglib"
authors = ["mmogr"]

# Workspace-wide dependencies: ONLY truly universal crates
# Adapter-specific deps (sqlx, clap, tauri, axum) are defined locally per crate
[workspace.dependencies]
# Async runtime.
#
# Deliberately NO features here. Features declared in [workspace.dependencies]
# are additive and unconditional — every inheriting crate gets them — so listing
# any would defeat the per-crate sets below. Each crate declares exactly what it
# uses via `tokio = { workspace = true, features = [...] }`.
#
# Note this does not shorten a full workspace build: Cargo unifies features
# across the graph, and gglib-download/gglib-runtime between them already need
# most of `full`. The win is honest manifests and cheap single-crate builds
# (`cargo check -p gglib-sse` no longer compiles process, net and signal).
tokio = { version = "1.0" }
tokio-test = "0.4"

# Futures / async streams
# Both crates are published in lock-step from the same futures-rs release; using
# the same constraint here ensures Cargo always resolves them to the same version.
futures-util = { version = "0.3" }
futures-core = { version = "0.3" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3"

# TypeScript binding generation, behind each deriving crate's `ts-bindings`
# feature. Every one of those crates sets `#![deny(unused_crate_dependencies)]`,
# so they take it as `{ workspace = true, optional = true }`: an optional
# dependency stays out of the build graph entirely until the feature turns it
# on, which is what keeps `-D warnings` clean in the default build.
#
# `chrono-impl` because a few wire types carry `DateTime<Utc>` directly; ts-rs
# maps those to `string`, which is what RFC 3339 arrives as.
ts-rs = { version = "12", features = ["chrono-impl"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Encoding
base64 = "0.22"

# Hashing (download checksum verification)
sha2 = "0.10"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = { version = "0.2" }

# Async traits
async-trait = "0.1.89"

# Filesystem/system utilities
dirs = "6.0"

# HuggingFace Hub SDK
hf-hub = "0.4"

# HTTP/Networking
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
indicatif = "0.18"
crossterm = "0.29"
termimad = "0.34.1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1.10", features = ["v4"] }

# Tauri
tauri = { version = "2.8.5", features = ["devtools", "tray-icon", "image-png"] }
tauri-build = { version = "2.4.1", features = [] }
tauri-plugin-dialog = "2.6"
tauri-plugin-autostart = "2"
dotenvy = "0.15"
open = "5"

# Linux tray panel placement. Versions match what Tauri already resolves, so
# these add no new copies to the tree; `gtk` in particular must stay in step
# with Tauri's or the GtkWindow types will not unify.
gtk = "0.18"
libloading = "0.7"
# StatusNotifierItem tray. Default features pull zbus/tokio, matching Tauri's
# runtime rather than starting a second one.
ksni = "0.3"

# System info
sysinfo = "0.37"

# Testing
tempfile = "3.8"
mockall = "0.14"
gglib-core = { path = "crates/gglib-core" }
gglib-db = { path = "crates/gglib-db", features = ["test-utils"] }
gglib-download = { path = "crates/gglib-download" }
gglib-gguf = { path = "crates/gglib-gguf" }
gglib-hf = { path = "crates/gglib-hf" }
gglib-runtime = { path = "crates/gglib-runtime" }
gglib-sse = { path = "crates/gglib-sse" }
gglib-axum = { path = "crates/gglib-axum" }
gglib-app-services = { path = "crates/gglib-app-services" }
gglib-tauri = { path = "crates/gglib-tauri" }
gglib-build-info = { path = "crates/gglib-build-info" }

# Workspace-wide lints for consistency
[workspace.lints.rust]
unsafe_code = "deny"
# Every `pub` must be reachable from outside its crate, so the keyword on an
# item means what it says rather than overstating the item's reach.
#
# It does *not* unlock `dead_code`, and the comment here used to claim it did.
# `dead_code` works off effective visibility, not the keyword: it already fires
# on a `pub fn` sitting in a private module, with or without this lint. The
# bound that carries this is **reachability**, not which kinds of item
# `dead_code` analyzes. `unreachable_pub` fires only on items already
# effectively non-public; of those, the ones `dead_code` examines at all are
# already inside its scope — so satisfying this lint can never widen what
# `dead_code` sees.
#
# Reachability is the right bound and item-kind is the wrong one, which is
# worth spelling out because both errors have been made in this comment.
# Narrowing a genuinely *reachable* function does widen `dead_code`'s view:
# `pub fn` in a `pub mod` is silent, and the same function as `pub(crate)` is
# reported. That is a real effect — it is simply not one this lint ever asks
# for, since it does not fire on reachable items at all.
#
# `unreachable_pub` also flags `pub mod` declarations and `pub use` re-exports,
# which `dead_code` does not examine at all (an unused re-export is
# `unused_imports`' business). Those are outside its scope rather than already
# inside it.
#
# What hides dead code here, none of which this lint can help with: an item
# genuinely reachable from the crate root through a `pub` path or `pub use`; an
# `allow(dead_code)` at any enclosing scope; a trait impl method, which
# `dead_code` never reports; and a `#[used]` static, which stays live at any
# visibility — so one already spelled `pub(crate)` satisfies this lint and is
# still hidden. Nothing in this workspace carries `#[used]` today, but nothing
# stops it: it never became an unsafe attribute and compiles cleanly under the
# `unsafe_code = "deny"` in this table.
#
# `#[no_mangle]` and `#[export_name]` anchor items the same way and are left off
# deliberately, because they cannot occur here at all: edition 2024 requires the
# `#[unsafe(...)]` spelling for both, and that same deny rejects it outright.
unreachable_pub = "deny"

[workspace.lints.rustdoc]
# Nothing here is published. Almost every package says `publish = false`, and
# the ones that do not take sibling crates from `[workspace.dependencies]`
# below, where they are bare `path` entries carrying no version — which
# `cargo publish` refuses outright. So no docs.rs build exists, and the only
# doc builds that do are `docs.yml` and `release.yml`, both of which pass
# `--document-private-items`.
# Under that flag these links resolve; the lint fires anyway, to warn that they
# would break without it.
#
# So it warns about a build this workspace never runs, and silencing it is not
# free: it buys back the module-to-module navigation that is most of what makes
# these docs worth reading, since the majority of this codebase is deliberately
# private. The alternative was to delete links that work.
#
# The coupling is real and worth stating: **if either workflow ever drops
# `--document-private-items`, those links go dead and nothing will say so.**
# Change this to "warn" in the same commit that drops the flag.
private_intra_doc_links = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow these common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
collapsible_if = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Irreconcilable with `unreachable_pub`. For an item in a private module the two
# ask for opposite things: `pub` trips `unreachable_pub`, `pub(crate)` trips
# this. One of them has to be off, and this is the nursery one.
#
# The earlier version of this comment also claimed `redundant_pub_crate`'s
# advice "hides dead code, since `pub` is exactly what stops `dead_code`
# looking". That is false — see the note on `unreachable_pub` above. The reason
# to prefer `unreachable_pub` is only that a keyword should describe the reach
# the item actually has.
redundant_pub_crate = "allow"

# Profile settings apply to all workspace members
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 0

# Optimize dependencies even in debug builds. Our own code stays at opt-level 0
# so incremental rebuilds remain fast, but third-party crates compile once and
# stay optimized — which matters a lot here, where debug builds hash multi-GB
# GGUF files through sha2 and stream downloads through reqwest/rustls.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 3

